<!doctype html><html><head><meta charset="utf-8"><title>42ndMind live browser selftest</title></head><body><pre id="result">RUNNING</pre><iframe id="app" src="./index.html?browser-selftest=1" style="width:1200px;height:900px"></iframe><script>
(async()=>{
 const out=document.getElementById('result'),frame=document.getElementById('app');
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 async function waitFor(fn,label,ms=45000){const end=Date.now()+ms;while(Date.now()<end){const v=fn();if(v)return v;await sleep(100)}const d=frame.contentDocument,boot=d?.getElementById('boot')?.textContent||'no boot text';throw new Error(`timeout: ${label}; child runtime=${d?.documentElement?.dataset?.runtime||'unset'}; boot=${boot}`)}
 async function ready(){return waitFor(()=>{const d=frame.contentDocument;if(!d)return false;const s=d.documentElement.dataset.runtime;if(s==='failed')throw new Error('runtime failed: '+(d.documentElement.dataset.runtimeError||d.getElementById('boot')?.textContent||'unknown'));return s==='ready'&&d.getElementById('input')&&!d.getElementById('input').disabled},'runtime ready')}
 try{
   await ready();
   let d=frame.contentDocument;
   const beforeText=d.getElementById('order').textContent;
   const before=Number(beforeText);
   const beforeKnown=Number.isFinite(before)&&beforeText.trim()!=='';
   const input=d.getElementById('input'),send=d.getElementById('send');
   if(input.disabled||send.disabled)throw new Error('contact controls are still disabled after runtime ready');
   input.value='browser selftest reality contact';send.click();
   await waitFor(()=>{if(d.documentElement.dataset.lastContact==='failed')throw new Error('contact failed: '+(d.documentElement.dataset.contactError||'unknown'));return d.documentElement.dataset.lastContact==='ok'},'contact completion');
   const afterText=d.getElementById('order').textContent,after=Number(afterText);
   if(!Number.isFinite(after)||afterText.trim()==='')throw new Error('lived order did not become numeric after first contact');
   if(beforeKnown&&!(after>before))throw new Error(`lived order did not advance (${before} -> ${after})`);
   if(!d.getElementById('contact').textContent.includes('browser selftest reality contact'))throw new Error('contact was not rendered');
   if(!/^\(\d+\)$/.test(d.getElementById('affectedCount').textContent))throw new Error('affected field count was not rendered');
   const oldDoc=d;
   frame.contentWindow.location.reload();
   await waitFor(()=>frame.contentDocument&&frame.contentDocument!==oldDoc,'iframe document replacement');
   await ready();d=frame.contentDocument;
   const reloadedText=d.getElementById('order').textContent,reloaded=Number(reloadedText);
   if(!Number.isFinite(reloaded)||reloaded!==after)throw new Error(`persisted M mismatch after reload (${after} -> ${reloadedText})`);
   if(d.getElementById('persisted').textContent!=='loaded')throw new Error(`page did not report loading persisted M (reported ${d.getElementById('persisted').textContent})`);
   document.documentElement.dataset.selftest='pass';out.textContent=`PASS\nruntime ready and input enabled\ncontact produced lived order ${after}${beforeKnown?` (from ${before})`:''}\naffected field rendered\nIndexedDB reload preserved order ${reloaded}`;
 }catch(e){document.documentElement.dataset.selftest='fail';out.textContent='FAIL\n'+e.stack;console.error(e)}
})();
</script></body></html>
