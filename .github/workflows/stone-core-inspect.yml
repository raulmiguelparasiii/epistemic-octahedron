name: Stone core inspect
on:
  push:
    branches: [stone-core-inspect-20261027]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect equator and point marker code
        shell: bash
        run: |
          set -euo pipefail
          cat philosophers-stone-atlas/core.01.b64 philosophers-stone-atlas/core.02.b64 philosophers-stone-atlas/core.03.b64 philosophers-stone-atlas/core.04.b64 philosophers-stone-atlas/core.05a.b64 philosophers-stone-atlas/core.05b.b64 philosophers-stone-atlas/core.06.b64 philosophers-stone-atlas/core.07.b64 philosophers-stone-atlas/core.08.b64 | tr -d '\n\r' | base64 -d | gzip -dc > /tmp/core.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/core.html').read_text()
          needles=['equator','equatorial','pointMarker','marker','state.point','LineBasicMaterial','red','surfacePoint','pointDot']
          for needle in needles:
              print('\n===== ',needle,' =====')
              start=0; count=0
              while True:
                  i=s.lower().find(needle.lower(),start)
                  if i<0 or count>=12: break
                  lo=max(0,i-1000); hi=min(len(s),i+2200)
                  print(s[lo:hi].replace('\n',' '))
                  print('\n---')
                  start=i+len(needle); count+=1
          PY
