name: Stone core inspect
on:
  push:
    branches: [stone-core-inspect-20261027]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stone-semantics-presentation-20261027
      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check philosophers-stone-atlas/stone-semantics-v5.js
          grep -Fq "stonePrejudicePresentation" philosophers-stone-atlas/index.html
          grep -Fq "makeCanonicalQuat(0,-0.22)" philosophers-stone-atlas/index.html
      - name: Prepare browser harness
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.56.1 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Browser smoke test
        timeout-minutes: 2
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/stone-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > /tmp/stone-test.js <<'NODE'
          const assert=require('assert');
          const {chromium}=require('playwright');
          const close=(a,b,t=.04)=>Math.abs(a-b)<=t;
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844}});
              page.setDefaultTimeout(7000);
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:8000/philosophers-stone-atlas/',{waitUntil:'domcontentloaded',timeout:12000});
              await page.waitForTimeout(700);
              const frame=page.frames().find(f=>f!==page.mainFrame());
              assert(frame,'Stone iframe missing');
              await frame.waitForFunction(()=>window.STONE_VIEW&&document.querySelector('#stoneSemanticsTab'),null,{timeout:8000});
              const item=name=>frame.locator('.stone-semantic-item').filter({has:frame.locator('summary',{hasText:name})}).first();
              const state=()=>frame.evaluate(()=>window.STONE_VIEW.getState());
              const point=()=>frame.evaluate(()=>['coord-x','coord-y','coord-z'].map(id=>Number(document.getElementById(id).value)));

              await frame.getByRole('button',{name:'Semantics',exact:true}).click();
              await item('Empathy').locator('summary').click();
              await frame.waitForTimeout(1500);
              let s=await state();
              assert(s.snappedTopBottom,'Empathy should settle top');
              assert(close(s.distance,5.6),'Top view should settle near 5.6');

              await item('Collapse').locator('summary').click();
              await frame.waitForTimeout(1300);
              s=await state();
              assert(!s.snappedTopBottom,'Collapse should remain side-like');
              assert(Math.abs(s.orientation[0])>.07,'Collapse should tilt downward');

              await item('Absence').locator('summary').click();
              await frame.waitForTimeout(1500);
              s=await state();
              assert(close(s.distance,4.25),'Absence should restore default distance');
              assert(Math.abs(s.orientation[0])<.025&&Math.abs(s.orientation[1])<.025&&Math.abs(s.orientation[2])<.025&&Math.abs(s.orientation[3]-1)<.025,'Absence should restore default orientation');

              await frame.evaluate(()=>window.postMessage({type:'set-profile',data:{data:{point:{x:.5,y:.5,z:0}}}},'*'));
              await frame.waitForTimeout(100);
              const before=await point();
              await item('Prejudice').locator('summary').click();
              await frame.waitForTimeout(1000);
              s=await state();
              assert.deepStrictEqual(await point(),before,'Prejudice must not move the point');
              assert.strictEqual(s.pointerVisible,false,'Prejudice must keep point marker hidden');
              assert.strictEqual(s.equatorColor,'#dc2626','Prejudice must make equator red');
              assert(s.equatorOpacity>.8,'Prejudice equator should be prominent');

              await item('Maturity').locator('summary').click();
              await frame.waitForTimeout(250);
              s=await state();
              assert.strictEqual(s.equatorColor,'#94a3b8','Leaving Prejudice should restore equator color');
              assert.strictEqual(s.equatorOpacity,0.28,'Leaving Prejudice should restore equator opacity');

              if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
              console.log('Semantic presentation smoke test passed.');
            } finally { await browser.close(); }
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/stone-test.js
