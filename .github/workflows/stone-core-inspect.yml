name: Stone core inspect
on:
  push:
    branches: [stone-core-inspect-20261027]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stone-native-semantics-20261027
      - name: Validate native semantics implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check philosophers-stone-atlas/stone-semantics-v5.js
          node --check philosophers-stone-atlas/stone-ui-v2.js
          cat philosophers-stone-atlas/core.01.b64 philosophers-stone-atlas/core.02.b64 philosophers-stone-atlas/core.03.b64 philosophers-stone-atlas/core.04.b64 philosophers-stone-atlas/core.05a.b64 philosophers-stone-atlas/core.05b.b64 philosophers-stone-atlas/core.06.b64 philosophers-stone-atlas/core.07.b64 philosophers-stone-atlas/core.08.b64 | tr -d '\n\r' | base64 -d | gzip -dc > /tmp/core.html
          grep -Fq "state.uiMode = ['plot','worldview','questions','editor'].includes(mode) ? mode : 'plot';" /tmp/core.html
          grep -Fq "const showingEditor = state.uiMode === 'editor';" /tmp/core.html
          grep -Fq "editorPanel.hidden = !showingEditor;" /tmp/core.html
          grep -Fq "function setPointFromExternal(profileData)" /tmp/core.html
          grep -Fq "function startSoftSnap(quat)" /tmp/core.html
          grep -Fq "function makeCanonicalQuat(yaw, pitch)" /tmp/core.html
          grep -Fq "function setPanelMode(mode)" /tmp/core.html
          grep -Fq "state.snappedTopBottom || !state.surfaceLocked" /tmp/core.html
          echo 'Native Stone semantics validation passed.'
