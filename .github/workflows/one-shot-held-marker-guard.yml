name: One-shot held seam marker guard
on:
  push:
    paths:
      - '.github/workflows/one-shot-held-marker-guard.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Guard native pointer marker during held seam
        shell: python
        run: |
          from pathlib import Path
          path=Path('philosophers-stone-atlas/index.html')
          s=path.read_text()
          old='''const pointerVisibilityPatched="pointerMarker.visible = !stoneDoctrinePresentation && !stonePrejudicePresentation && !state.snappedTopBottom && state.uiMode !== 'editor' && state.uiMode !== 'questions';";'''
          new='''const pointerVisibilityPatched="pointerMarker.visible = !stoneEntranceHeld && !stoneDoctrinePresentation && !stonePrejudicePresentation && !state.snappedTopBottom && state.uiMode !== 'editor' && state.uiMode !== 'questions';";'''
          assert s.count(old)==1
          s=s.replace(old,new)
          path.write_text(s)

          sw=Path('philosophers-stone-atlas/service-worker.js')
          w=sw.read_text()
          assert w.count('philosophers-stone-atlas-offline-v8')==1
          w=w.replace('philosophers-stone-atlas-offline-v8','philosophers-stone-atlas-offline-v9')
          sw.write_text(w)
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('philosophers-stone-atlas/index.html').read_text()
          w=Path('philosophers-stone-atlas/service-worker.js').read_text()
          assert s.count("pointerMarker.visible = !stoneEntranceHeld && !stoneDoctrinePresentation")>=1
          assert 'philosophers-stone-atlas-offline-v9' in w
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/one-shot-held-marker-guard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add philosophers-stone-atlas/index.html philosophers-stone-atlas/service-worker.js .github/workflows/one-shot-held-marker-guard.yml
          git commit -m 'Keep Atlas marker hidden at held seam'
          git push
