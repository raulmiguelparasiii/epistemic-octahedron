name: One-shot smooth portal transitions
on:
  push:
    paths:
      - '.github/workflows/one-shot-smooth-portal-transitions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch helper
        run: |
          sed -i 's/assert s.count(old)>=2/assert s.count(old)==1/' .github/portal_transition_patch.py
          python .github/portal_transition_patch.py
      - name: Commit and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add philosophers-stone-atlas/index.html philosophers-stone-atlas/service-worker.js
          git commit -m 'Smooth Stone portal transitions'
          git rm -f .github/workflows/one-shot-smooth-portal-transitions.yml .github/portal_transition_patch.py
          git commit -m 'Remove one-shot smooth portal patch files'
          git push
