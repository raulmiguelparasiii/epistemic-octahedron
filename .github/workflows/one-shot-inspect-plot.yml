name: One-shot inspect native Plot markup
on:
  push:
    paths:
      - '.github/workflows/one-shot-inspect-plot.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect compressed core
        shell: python
        run: |
          from pathlib import Path
          import base64,gzip,re
          root=Path('philosophers-stone-atlas')
          names=['core.01.b64','core.02.b64','core.03.b64','core.04.b64','core.05a.b64','core.05b.b64','core.06.b64','core.07.b64','core.08.b64']
          raw=''.join((root/n).read_text().strip() for n in names)
          core=gzip.decompress(base64.b64decode(raw)).decode()
          lines=core.splitlines()
          needles=['stability','plotPanel','coord-y','Positive','Negative','Plot']
          for i,line in enumerate(lines):
            if any(n.lower() in line.lower() for n in needles):
              lo=max(0,i-3); hi=min(len(lines),i+4)
              print(f'--- lines {lo+1}-{hi} ---')
              print('\n'.join(f'{j+1}: {lines[j]}' for j in range(lo,hi)))
