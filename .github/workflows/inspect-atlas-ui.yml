name: Inspect Atlas UI structure
on:
  push:
    paths:
      - '.github/workflows/inspect-atlas-ui.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompress and inspect UI
        shell: python
        run: |
          import base64, gzip, re
          from pathlib import Path
          root=Path('philosophers-stone-atlas')
          names=['core.01.b64','core.02.b64','core.03.b64','core.04.b64','core.05a.b64','core.05b.b64','core.06.b64','core.07.b64','core.08.b64']
          packed=''.join((root/n).read_text().strip() for n in names)
          core=gzip.decompress(base64.b64decode(packed)).decode()
          print('CORE_LINES', len(core.splitlines()))
          print('--- IDs / input / button / viewport markup ---')
          for i,line in enumerate(core.splitlines(),1):
              low=line.lower()
              if any(k in low for k in ['id="','type="range"','<button','<input','viewport','plot']):
                  print(f'{i}: {line[:500]}')
          print('--- UI selectors / plot / slider refs ---')
          for i,line in enumerate(core.splitlines(),1):
              low=line.lower()
              if any(k in low for k in ['getelementbyid','queryselector','slider','plot','input[type','addEventListener']) and len(line)<1200:
                  print(f'{i}: {line}')
