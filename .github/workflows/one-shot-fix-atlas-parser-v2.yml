name: One-shot Atlas parser fix v2
on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-atlas-parser-v2.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Atlas held-seam parser regression
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          path=Path('philosophers-stone-atlas/index.html')
          s=path.read_text()
          old='''    const stonePortalHoldStyle=document.createElement('style');\n    stonePortalHoldStyle.textContent=`\n      #ui,#crosshair,#viewLabels,#sliderTooltip,#aspectTooltip{transition:opacity 180ms ease!important}\n      body.stone-portal-held #ui,\n      body.stone-portal-held #crosshair,\n      body.stone-portal-held #viewLabels,\n      body.stone-portal-held #sliderTooltip,\n      body.stone-portal-held #aspectTooltip{opacity:0!important;pointer-events:none!important}\n    `;\n    document.head.appendChild(stonePortalHoldStyle);'''
          new='''    const stonePortalHoldStyle=document.createElement('style');\n    stonePortalHoldStyle.textContent=[\n      '#ui,#crosshair,#viewLabels,#sliderTooltip,#aspectTooltip{transition:opacity 180ms ease!important}',\n      'body.stone-portal-held #ui,',\n      'body.stone-portal-held #crosshair,',\n      'body.stone-portal-held #viewLabels,',\n      'body.stone-portal-held #sliderTooltip,',\n      'body.stone-portal-held #aspectTooltip{opacity:0!important;pointer-events:none!important}'\n    ].join(String.fromCharCode(10));\n    document.head.appendChild(stonePortalHoldStyle);'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          path.write_text(s)

          sw=Path('philosophers-stone-atlas/service-worker.js')
          w=sw.read_text()
          assert w.count('philosophers-stone-atlas-offline-v9')==1
          sw.write_text(w.replace('philosophers-stone-atlas-offline-v9','philosophers-stone-atlas-offline-v10'))

          # Parse-check every inline wrapper script. This specifically catches the regression
          # that the earlier string-presence validation missed.
          s=path.read_text()
          scripts=[]
          for m in re.finditer(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>',s,re.S|re.I):
              if 'src=' not in m.group('attrs').lower() and m.group('body').strip():
                  scripts.append(m.group('body'))
          assert scripts
          tmp=Path('/tmp/atlas-inline')
          tmp.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              f=tmp/f'{i}.js'
              f.write_text(body)
              subprocess.run(['node','--check',str(f)],check=True)
      - name: Validate transition anchors
        shell: python
        run: |
          from pathlib import Path
          s=Path('philosophers-stone-atlas/index.html').read_text()
          w=Path('philosophers-stone-atlas/service-worker.js').read_text()
          assert 'stonePortalHoldStyle.textContent=`' not in s
          assert "stonePortalHoldStyle.textContent=[" in s
          assert 'STONE_RETURN_DWELL_MS=2000' in s
          assert 'wakeFromPortal()' in s
          assert 'stoneSetEntranceHeld(true)' in s
          assert "philosophers-stone-atlas-offline-v10" in w
      - name: Commit fix and remove temporary workflows
        run: |
          rm -f .github/workflows/one-shot-fix-atlas-parser.yml
          rm -f .github/workflows/one-shot-fix-atlas-parser-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add philosophers-stone-atlas/index.html philosophers-stone-atlas/service-worker.js .github/workflows/one-shot-fix-atlas-parser.yml .github/workflows/one-shot-fix-atlas-parser-v2.yml
          git commit -m 'Fix Atlas held-seam parser regression'
          git push
