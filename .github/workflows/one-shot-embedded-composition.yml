name: One-shot embedded Stone composition bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-embedded-composition.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply embedded composition bridge
        run: python .github/one-shot-embedded-composition.py
      - name: Commit implementation and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-embedded-composition.yml .github/one-shot-embedded-composition.py
          git add philosophers-stone-atlas/index.html philosophers-stone-atlas/service-worker.js
          git diff --cached --check
          git commit -m "Support embedded Atlas composition handoff"
          git push
