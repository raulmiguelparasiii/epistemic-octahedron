name: One-shot portal phase synchronization fix
on:
  push:
    paths:
      - '.github/workflows/one-shot-portal-phase-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Atlas portal synchronization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('philosophers-stone-atlas/index.html')
          text = path.read_text()

          old = """    const stoneNativeUnitScale=(height,distance=state.distance)=>
      height/(2*Math.max(distance,0.0001)*Math.tan(THREE.MathUtils.degToRad(STONE_NATIVE_FOV)*0.5));
    const applyStonePortalCamera=()=>{
      const {width,height}=getViewportSize();
      camera.aspect=width/height;
      camera.fov=stoneCurrentFov();
      camera.near=0.01;
      camera.far=5000;
      camera.updateProjectionMatrix();
      renderer.setSize(width,height);
      syncSceneMatrices();
      camera.position.set(0,0,Number.isFinite(stonePortalCameraDistance)?stonePortalCameraDistance:state.distance);
      camera.lookAt(rootGroup.position);
      camera.updateMatrixWorld();
    };
"""
          new = """    const stoneNativeUnitScale=(height,distance=state.distance)=>
      height/(2*Math.max(distance,0.0001)*Math.tan(THREE.MathUtils.degToRad(STONE_NATIVE_FOV)*0.5));
    const stonePortalRendererSize=new THREE.Vector2();
    const applyStonePortalCamera=()=>{
      const {width,height}=getViewportSize();
      camera.aspect=width/height;
      camera.fov=stoneCurrentFov();
      camera.near=0.01;
      camera.far=5000;
      camera.updateProjectionMatrix();
      renderer.getSize(stonePortalRendererSize);
      if(
        Math.abs(stonePortalRendererSize.x-width)>0.25||
        Math.abs(stonePortalRendererSize.y-height)>0.25
      ) renderer.setSize(width,height);
      syncSceneMatrices();
      camera.position.set(0,0,Number.isFinite(stonePortalCameraDistance)?stonePortalCameraDistance:state.distance);
      camera.lookAt(rootGroup.position);
      camera.updateMatrixWorld();
    };
    const renderStonePortalSnapshot=()=>{
      pointerMarker.visible=stonePointerVisibility();
      updateCrosshairAndLabels();
      updatePointerLabelStacking();
      renderer.render(scene,camera);
    };
"""
          if text.count(old) != 1:
              raise SystemExit(f'camera anchor count {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """        applyStonePortalCamera();
        invalidateRender();
        return true;
      },
      cancelPortalPreview(){
"""
          new = """        applyStonePortalCamera();
        renderStonePortalSnapshot();
        invalidateRender();
        return true;
      },
      cancelPortalPreview(){
"""
          if text.count(old) != 1:
              raise SystemExit(f'sync render anchor count {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """        if(embeddedMode){
          const postEmbeddedState=()=>{
"""
          new = """        if(embeddedMode){
          window.STONE_EMBED={
            syncFromBlack(yaw,pitch,rect){
              return frame.contentWindow?.STONE_VIEW?.syncFromBlack?.(yaw,pitch,rect)??false;
            },
            cancelBlackPreview(){
              return frame.contentWindow?.STONE_VIEW?.cancelPortalPreview?.()??false;
            },
            activateAtlas(){
              return frame.contentWindow?.STONE_VIEW?.activateFromPortal?.()??false;
            },
            portalState(){
              return frame.contentWindow?.STONE_VIEW?.portalState?.()??null;
            }
          };
          const postEmbeddedState=()=>{
"""
          if text.count(old) != 1:
              raise SystemExit(f'embedded bridge anchor count {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)

          sw = Path('philosophers-stone-atlas/service-worker.js')
          sw_text = sw.read_text()
          sw_text = sw_text.replace("const CACHE_NAME = 'philosophers-stone-atlas-offline-v11';", "const CACHE_NAME = 'philosophers-stone-atlas-offline-v12';", 1)
          sw_text = sw_text.replace('// revision: 2026-10-29 Plot terminology and current paper assets.', '// revision: 2026-10-30 Portal phase synchronization and immediate seam rendering.', 1)
          if "offline-v12" not in sw_text:
              raise SystemExit('service worker cache bump failed')
          sw.write_text(sw_text)
          PY

          grep -F "renderStonePortalSnapshot" philosophers-stone-atlas/index.html
          grep -F "window.STONE_EMBED" philosophers-stone-atlas/index.html
          grep -F "offline-v12" philosophers-stone-atlas/service-worker.js
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/one-shot-portal-phase-fix.yml
          git add philosophers-stone-atlas/index.html philosophers-stone-atlas/service-worker.js
          git commit -m 'Reduce portal seam phase latency'
          git push
