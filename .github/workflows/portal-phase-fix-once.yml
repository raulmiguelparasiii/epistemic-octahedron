name: Portal phase fix once
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Atlas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('philosophers-stone-atlas/index.html')
          text = path.read_text()

          camera_start = text.index('    const applyStonePortalCamera=()=>{')
          camera_end = text.index('    const stoneFinishPortalLayout=()=>{', camera_start)
          camera_block = text[camera_start:camera_end]
          resize_line = '      renderer.setSize(width,height);'
          if camera_block.count(resize_line) != 1:
              raise SystemExit(f'portal renderer resize count {camera_block.count(resize_line)}')
          camera_block = camera_block.replace(
              resize_line,
              """      renderer.getSize(stonePortalRendererSize);
              if(
                Math.abs(stonePortalRendererSize.x-width)>0.25||
                Math.abs(stonePortalRendererSize.y-height)>0.25
              ) renderer.setSize(width,height);""",
              1
          )
          camera_block = (
              '    const stonePortalRendererSize=new THREE.Vector2();\n' +
              camera_block.rstrip('\n') +
              """
              const renderStonePortalSnapshot=()=>{
                pointerMarker.visible=stonePointerVisibility();
                updateCrosshairAndLabels();
                updatePointerLabelStacking();
                renderer.render(scene,camera);
              };
          """
          )
          text = text[:camera_start] + camera_block + text[camera_end:]

          sync_start = text.index('      syncFromBlack(yaw,pitch,rect){')
          sync_end = text.index('      cancelPortalPreview(){', sync_start)
          sync_block = text[sync_start:sync_end]
          sync_anchor = '        applyStonePortalCamera();\n        invalidateRender();'
          if sync_block.count(sync_anchor) != 1:
              raise SystemExit(f'sync camera anchor count {sync_block.count(sync_anchor)}')
          sync_block = sync_block.replace(
              sync_anchor,
              '        applyStonePortalCamera();\n        renderStonePortalSnapshot();\n        invalidateRender();',
              1
          )
          text = text[:sync_start] + sync_block + text[sync_end:]

          embedded_anchor = """        if(embeddedMode){
                  const postEmbeddedState=()=>{"""
          if embedded_anchor not in text:
              embedded_anchor = """        if(embeddedMode){
          const postEmbeddedState=()=>{"""
          if text.count(embedded_anchor) != 1:
              raise SystemExit(f'embedded bridge anchor count {text.count(embedded_anchor)}')
          indent = embedded_anchor.split('\n')[1].split('const')[0]
          bridge = """        if(embeddedMode){
          window.STONE_EMBED={
            syncFromBlack(yaw,pitch,rect){
              return frame.contentWindow?.STONE_VIEW?.syncFromBlack?.(yaw,pitch,rect)??false;
            },
            cancelBlackPreview(){
              return frame.contentWindow?.STONE_VIEW?.cancelPortalPreview?.()??false;
            },
            activateAtlas(){
              return frame.contentWindow?.STONE_VIEW?.activateFromPortal?.()??false;
            },
            portalState(){
              return frame.contentWindow?.STONE_VIEW?.portalState?.()??null;
            }
          };
          const postEmbeddedState=()=>{"""
          text = text.replace(embedded_anchor, bridge, 1)
          path.write_text(text)

          sw = Path('philosophers-stone-atlas/service-worker.js')
          sw_text = sw.read_text()
          old_cache = "const CACHE_NAME = 'philosophers-stone-atlas-offline-v11';"
          if sw_text.count(old_cache) != 1:
              raise SystemExit(f'cache anchor count {sw_text.count(old_cache)}')
          sw_text = sw_text.replace(old_cache, "const CACHE_NAME = 'philosophers-stone-atlas-offline-v12';", 1)
          old_rev = '// revision: 2026-10-29 Plot terminology and current paper assets.'
          if sw_text.count(old_rev) != 1:
              raise SystemExit(f'revision anchor count {sw_text.count(old_rev)}')
          sw_text = sw_text.replace(old_rev, '// revision: 2026-10-30 Portal phase synchronization and immediate seam rendering.', 1)
          sw.write_text(sw_text)
          PY
          grep -F 'renderStonePortalSnapshot' philosophers-stone-atlas/index.html
          grep -F 'window.STONE_EMBED' philosophers-stone-atlas/index.html
          grep -F 'offline-v12' philosophers-stone-atlas/service-worker.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/portal-phase-fix-once.yml
          git add philosophers-stone-atlas/index.html philosophers-stone-atlas/service-worker.js
          git commit -m 'Reduce portal seam phase latency'
          git push
