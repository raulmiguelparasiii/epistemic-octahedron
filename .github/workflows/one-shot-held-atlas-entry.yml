name: One-shot held Atlas entry
on:
  push:
    paths:
      - '.github/workflows/one-shot-held-atlas-entry.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply held seam and two-second return dwell
        shell: python
        run: |
          from pathlib import Path

          path=Path('philosophers-stone-atlas/index.html')
          s=path.read_text()

          old='''    let stonePrejudicePresentation=false;\n    let stoneDoctrinePresentation=false;\n    const stonePointerVisibility=()=>!stoneDoctrinePresentation && !stonePrejudicePresentation && !state.snappedTopBottom && state.uiMode!=='editor' && state.uiMode!=='questions';'''
          new='''    let stonePrejudicePresentation=false;\n    let stoneDoctrinePresentation=false;\n    let stoneEntranceHeld=false;\n    const stonePointerVisibility=()=>!stoneEntranceHeld && !stoneDoctrinePresentation && !stonePrejudicePresentation && !state.snappedTopBottom && state.uiMode!=='editor' && state.uiMode!=='questions';\n    const stonePortalHoldStyle=document.createElement('style');\n    stonePortalHoldStyle.textContent=`\n      #ui,#crosshair,#viewLabels,#sliderTooltip,#aspectTooltip{transition:opacity 180ms ease!important}\n      body.stone-portal-held #ui,\n      body.stone-portal-held #crosshair,\n      body.stone-portal-held #viewLabels,\n      body.stone-portal-held #sliderTooltip,\n      body.stone-portal-held #aspectTooltip{opacity:0!important;pointer-events:none!important}\n    `;\n    document.head.appendChild(stonePortalHoldStyle);\n    const stoneSetEntranceHeld=held=>{\n      stoneEntranceHeld=!!held;\n      document.body.classList.toggle('stone-portal-held',stoneEntranceHeld);\n      const ui=document.getElementById('ui');\n      if(ui) ui.setAttribute('aria-hidden',String(stoneEntranceHeld));\n      pointerMarker.visible=stonePointerVisibility();\n      invalidateRender();\n    };'''
          assert s.count(old)==1
          s=s.replace(old,new)

          old='''    const STONE_RETURN_DWELL_MS=1000;'''
          new='''    const STONE_RETURN_DWELL_MS=2000;'''
          assert s.count(old)==1
          s=s.replace(old,new)

          old='''    const stoneBeginEntranceTransition=()=>{\n      if(!stonePortalLayout) return false;\n      const startRect=viewport.getBoundingClientRect();'''
          new='''    const stoneBeginEntranceTransition=()=>{\n      if(!stonePortalLayout) return false;\n      stoneSetEntranceHeld(false);\n      const startRect=viewport.getBoundingClientRect();'''
          assert s.count(old)==1
          s=s.replace(old,new)

          old='''    const stoneArmReturnFromThrow=()=>{\n      if(!stoneCompositionBridgeEnabled||stoneEntranceTransition) return false;'''
          new='''    const stoneArmReturnFromThrow=()=>{\n      if(!stoneCompositionBridgeEnabled||stoneEntranceHeld||stoneEntranceTransition) return false;'''
          assert s.count(old)==1
          s=s.replace(old,new)

          old='''        stoneCompositionBridgeEnabled=true;\n        stoneEntranceTransition=null;\n        stoneReturnArmed=false;'''
          new='''        stoneCompositionBridgeEnabled=true;\n        stoneEntranceTransition=null;\n        stoneSetEntranceHeld(true);\n        stoneReturnArmed=false;'''
          assert s.count(old)==1
          s=s.replace(old,new)

          old='''      cancelPortalPreview(){\n        stoneEntranceTransition=null;\n        stoneProjectionBlend=0;'''
          new='''      cancelPortalPreview(){\n        stoneEntranceTransition=null;\n        stoneSetEntranceHeld(false);\n        stoneProjectionBlend=0;'''
          assert s.count(old)==1
          s=s.replace(old,new)

          old='''      activateFromPortal(){\n        return stoneBeginEntranceTransition();\n      },\n      cancelReturnCapture(){'''
          new='''      activateFromPortal(){\n        if(!stonePortalLayout) return false;\n        stoneCompositionBridgeEnabled=true;\n        stoneSetEntranceHeld(true);\n        state.angularSpeed=0;\n        state.snapQuat=null;\n        resetUprightStabilizer();\n        state.panVel.set(0,0,0);\n        state.zoomVel=0;\n        invalidateRender();\n        return true;\n      },\n      wakeFromPortal(){\n        if(!stoneEntranceHeld) return false;\n        return stoneBeginEntranceTransition();\n      },\n      cancelReturnCapture(){'''
          assert s.count(old)==1
          s=s.replace(old,new)

          old='''        returnArmed:stoneReturnArmed,\n        returnReady:stoneReturnReady,'''
          new='''        returnArmed:stoneReturnArmed,\n        returnReady:stoneReturnReady,\n        entranceHeld:stoneEntranceHeld,'''
          assert s.count(old)==1
          s=s.replace(old,new)

          old='''  inner.addEventListener('pointerdown',event=>{\n    activePortalPointers.add(event.pointerId);\n  },true);'''
          new='''  inner.addEventListener('pointerdown',event=>{\n    activePortalPointers.add(event.pointerId);\n    if(embeddedMode) inner.STONE_VIEW?.wakeFromPortal?.();\n  },true);'''
          assert s.count(old)==1
          s=s.replace(old,new)

          path.write_text(s)

          sw=Path('philosophers-stone-atlas/service-worker.js')
          w=sw.read_text()
          assert w.count("philosophers-stone-atlas-offline-v7")==1
          w=w.replace("philosophers-stone-atlas-offline-v7","philosophers-stone-atlas-offline-v8")
          sw.write_text(w)
      - name: Validate runtime patch state
        shell: python
        run: |
          from pathlib import Path
          s=Path('philosophers-stone-atlas/index.html').read_text()
          w=Path('philosophers-stone-atlas/service-worker.js').read_text()
          checks=[
            'STONE_RETURN_DWELL_MS=2000',
            'let stoneEntranceHeld=false',
            'body.stone-portal-held #ui',
            'stoneSetEntranceHeld(true)',
            'wakeFromPortal()',
            "if(embeddedMode) inner.STONE_VIEW?.wakeFromPortal?.()",
            'entranceHeld:stoneEntranceHeld',
            'stoneEntranceHeld||stoneEntranceTransition',
          ]
          for x in checks: assert x in s, x
          assert 'STONE_RETURN_DWELL_MS=1000' not in s
          assert 'philosophers-stone-atlas-offline-v8' in w
          assert 'philosophers-stone-atlas-offline-v7' not in w
      - name: Commit implementation and remove temporary workflows
        run: |
          rm -f .github/workflows/inspect-atlas-ui.yml
          rm -f .github/workflows/one-shot-held-atlas-entry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add philosophers-stone-atlas/index.html philosophers-stone-atlas/service-worker.js .github/workflows/inspect-atlas-ui.yml .github/workflows/one-shot-held-atlas-entry.yml
          git commit -m 'Hold Atlas seam until interaction'
          git push
