name: One-shot Atlas parser regression fix
on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-atlas-parser.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix nested template literal and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('philosophers-stone-atlas/index.html')
          s=p.read_text()
          old="""    const stonePortalHoldStyle=document.createElement('style');
    stonePortalHoldStyle.textContent=`
      #ui,#crosshair,#viewLabels,#sliderTooltip,#aspectTooltip{transition:opacity 180ms ease!important}
      body.stone-portal-held #ui,
      body.stone-portal-held #crosshair,
      body.stone-portal-held #viewLabels,
      body.stone-portal-held #sliderTooltip,
      body.stone-portal-held #aspectTooltip{opacity:0!important;pointer-events:none!important}
    `;
    document.head.appendChild(stonePortalHoldStyle);"""
          new="""    const stonePortalHoldStyle=document.createElement('style');
    stonePortalHoldStyle.textContent=[
      '#ui,#crosshair,#viewLabels,#sliderTooltip,#aspectTooltip{transition:opacity 180ms ease!important}',
      'body.stone-portal-held #ui,',
      'body.stone-portal-held #crosshair,',
      'body.stone-portal-held #viewLabels,',
      'body.stone-portal-held #sliderTooltip,',
      'body.stone-portal-held #aspectTooltip{opacity:0!important;pointer-events:none!important}'
    ].join('\\\\n');
    document.head.appendChild(stonePortalHoldStyle);"""
          if old not in s:
              raise SystemExit('broken held-style block not found exactly')
          s=s.replace(old,new,1)
          p.write_text(s)
          sw=Path('philosophers-stone-atlas/service-worker.js')
          w=sw.read_text()
          if "philosophers-stone-atlas-offline-v9" not in w:
              raise SystemExit('expected v9 cache anchor missing')
          sw.write_text(w.replace('philosophers-stone-atlas-offline-v9','philosophers-stone-atlas-offline-v10',1))
          PY
      - name: Syntax-check every inline Atlas script
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('philosophers-stone-atlas/index.html').read_text()
          scripts=[]
          for m in re.finditer(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>',s,re.S|re.I):
              if 'src=' in m.group('attrs').lower():
                  continue
              body=m.group('body')
              if body.strip(): scripts.append(body)
          if not scripts:
              raise SystemExit('no inline scripts found')
          out=Path('/tmp/atlas-inline')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body)
          print('inline scripts:',len(scripts))
          PY
          for f in /tmp/atlas-inline/*.js; do node --check "$f"; done
          ! grep -F 'stonePortalHoldStyle.textContent=`' philosophers-stone-atlas/index.html
          grep -F "STONE_RETURN_DWELL_MS=2000" philosophers-stone-atlas/index.html
          grep -F "stoneSetEntranceHeld(true)" philosophers-stone-atlas/index.html
          grep -F "philosophers-stone-atlas-offline-v10" philosophers-stone-atlas/service-worker.js
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add philosophers-stone-atlas/index.html philosophers-stone-atlas/service-worker.js
          git commit -m "Fix Atlas held-seam parser regression"
          git rm .github/workflows/one-shot-fix-atlas-parser.yml
          git commit -m "Remove one-shot Atlas parser fix workflow"
          git push
