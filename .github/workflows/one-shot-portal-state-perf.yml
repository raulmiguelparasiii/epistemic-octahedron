name: One-shot Stone portal-state performance fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-portal-state-perf.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove resize work from read-only state probe
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('philosophers-stone-atlas/index.html')
          s=p.read_text()
          old='''    const stonePortalState=()=>{\n      applyStonePortalCamera();\n      const canvasRect=renderer.domElement.getBoundingClientRect();'''
          new='''    const stonePortalState=()=>{\n      syncSceneMatrices();\n      camera.lookAt(rootGroup.position);\n      camera.updateMatrixWorld();\n      const canvasRect=renderer.domElement.getBoundingClientRect();'''
          if s.count(old)!=1: raise SystemExit(f'portal state anchor count {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          sw=Path('philosophers-stone-atlas/service-worker.js')
          t=sw.read_text()
          oldv="const CACHE_NAME = 'philosophers-stone-atlas-offline-v6';"
          newv="const CACHE_NAME = 'philosophers-stone-atlas-offline-v7';"
          if t.count(oldv)!=1: raise SystemExit(f'cache anchor count {t.count(oldv)}')
          sw.write_text(t.replace(oldv,newv,1))
          PY
      - name: Validate
        run: |
          grep -F "syncSceneMatrices();" philosophers-stone-atlas/index.html >/dev/null
          grep -F "philosophers-stone-atlas-offline-v7" philosophers-stone-atlas/service-worker.js >/dev/null
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/one-shot-portal-state-perf.yml
          git add philosophers-stone-atlas/index.html philosophers-stone-atlas/service-worker.js
          git commit -m 'Avoid redundant Atlas state-probe resize'
          git push
