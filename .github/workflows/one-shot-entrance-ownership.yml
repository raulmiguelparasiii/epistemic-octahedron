name: One-shot entrance ownership refinement
on:
  push:
    paths:
      - '.github/workflows/one-shot-entrance-ownership.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine entrance orientation ownership
        shell: python
        run: |
          from pathlib import Path
          p=Path('philosophers-stone-atlas/index.html')
          s=p.read_text()
          old="""        startQuat:state.orientation.clone(),
        targetQuat:stoneNativeTargetQuat(),
        orientationUserOwned:false
      };"""
          new="""        startQuat:state.orientation.clone(),
        targetQuat:stoneNativeTargetQuat(),
        lastAppliedQuat:state.orientation.clone(),
        orientationUserOwned:false
      };"""
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old="""      const rotating=state.rotating||state.gestureRotating||state.continuingGestureRotate;
      if(rotating) stoneEntranceTransition.orientationUserOwned=true;
      if(!stoneEntranceTransition.orientationUserOwned){
        state.orientation.slerpQuaternions(tr.startQuat,tr.targetQuat,t);
        state.angularSpeed=0;
        state.snapQuat=null;
        resetUprightStabilizer();
      }"""
          new="""      const rotating=state.rotating||state.gestureRotating||state.continuingGestureRotate;
      if(
        rotating &&
        state.orientation.angleTo(tr.lastAppliedQuat)>THREE.MathUtils.degToRad(0.12)
      ) stoneEntranceTransition.orientationUserOwned=true;
      if(!stoneEntranceTransition.orientationUserOwned){
        state.orientation.slerpQuaternions(tr.startQuat,tr.targetQuat,t);
        tr.lastAppliedQuat.copy(state.orientation);
        state.angularSpeed=0;
        state.snapQuat=null;
        resetUprightStabilizer();
      }"""
          assert s.count(old)==1
          s=s.replace(old,new,1)
          p.write_text(s)
          check=p.read_text()
          assert 'lastAppliedQuat:state.orientation.clone()' in check
          assert 'angleTo(tr.lastAppliedQuat)>THREE.MathUtils.degToRad(0.12)' in check
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add philosophers-stone-atlas/index.html
          git commit -m 'Let taps keep smooth Atlas entrance'
          git rm .github/workflows/one-shot-entrance-ownership.yml
          git commit -m 'Remove one-shot entrance ownership workflow'
          git push
