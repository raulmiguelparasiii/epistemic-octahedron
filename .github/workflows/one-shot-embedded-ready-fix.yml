name: One-shot embedded Atlas readiness fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-embedded-ready-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply readiness fix
        run: python .github/one-shot-embedded-ready-fix.py
      - name: Commit fix and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-embedded-ready-fix.yml .github/one-shot-embedded-ready-fix.py
          git add philosophers-stone-atlas/index.html philosophers-stone-atlas/service-worker.js
          git diff --cached --check
          git commit -m "Signal embedded Atlas readiness after load"
          git push
