name: Stone doctrine structure audit test

on:
  push:
    branches: [stone-doctrine-structure-audit-test-20261028]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static validation
        run: |
          set -euo pipefail
          node --check philosophers-stone-atlas/stone-doctrines-v6.js
          ! grep -Fq "Existentialism:{" philosophers-stone-atlas/stone-doctrines-v6.js
          ! grep -Fq "Stoicism:{" philosophers-stone-atlas/stone-doctrines-v6.js
          ! grep -Fq "Utilitarianism:{" philosophers-stone-atlas/stone-doctrines-v6.js
          ! grep -Fq "Deontology:{" philosophers-stone-atlas/stone-doctrines-v6.js
          ! grep -Fq "Skepticism:{" philosophers-stone-atlas/stone-doctrines-v6.js
          ! grep -Fq "Hedonism:{" philosophers-stone-atlas/stone-doctrines-v6.js
      - name: Prepare browser harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.56.1 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Browser smoke test
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/stone-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > /tmp/stone-doctrine-structure-test.js <<'NODE'
          const assert=require('assert');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/philosophers-stone-atlas/',{waitUntil:'domcontentloaded',timeout:30000});
            const frame=page.frames().find(f=>f!==page.mainFrame());
            assert(frame,'Stone iframe missing');
            await frame.waitForFunction(()=>window.STONE_VIEW&&window.STONE_DOCTRINES_V6&&document.querySelector('.stone-ref-option[data-ref="doctrines"]'),null,{timeout:25000});
            await frame.getByRole('button',{name:'Referent',exact:true}).click();
            await frame.locator('.stone-ref-option[data-ref="doctrines"]').click();
            await frame.waitForSelector('#stoneReferentContent .stone-doctrine-item');

            const names=await frame.locator('#stoneReferentContent .stone-doctrine-item').evaluateAll(items=>items.map(x=>x.dataset.doctrine));
            assert.deepStrictEqual(names,['Nihilism','Moral relativism','Solipsism']);
            const api=await frame.evaluate(()=>({
              nihilism:window.STONE_DOCTRINES_V6.regionTriangles('Nihilism'),
              relativism:window.STONE_DOCTRINES_V6.regionTriangles('Moral relativism'),
              solipsism:window.STONE_DOCTRINES_V6.regionTriangles('Solipsism')
            }));
            assert(api.nihilism.length>0&&api.relativism.length>0&&api.solipsism.length>0,'All doctrine regions must be non-empty');
            const flat=tris=>tris.flat();
            assert(flat(api.nihilism).every(p=>p[2]<0.001),'Nihilism must remain on information side');
            assert(flat(api.relativism).every(p=>p[2]>-0.001),'Relativism must remain on interpretation side');
            assert(flat(api.solipsism).every(p=>p[1]<=-0.68+1e-9),'Solipsism must remain collapse-adjacent');

            for(const name of names){
              const item=frame.locator(`#stoneReferentContent .stone-doctrine-item[data-doctrine="${name}"]`);
              await item.locator('summary').click();
              await frame.waitForTimeout(80);
              const s=await frame.evaluate(()=>window.STONE_VIEW.getState());
              assert.strictEqual(s.doctrineRegionVisible,true,`${name} should show region`);
              assert.strictEqual(s.doctrineRegionMode,'mesh',`${name} should use continuous mesh`);
              assert.strictEqual(s.pointerVisible,false,`${name} should hide plot marker`);
              assert.strictEqual(await frame.locator('#stoneReferentContent .stone-doctrine-item[open]').count(),1,'Only one doctrine should be open');
            }

            if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
            await browser.close();
            console.log('Doctrine structure audit smoke test passed.');
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
          NODE_PATH="$PWD/node_modules" timeout 90s node /tmp/stone-doctrine-structure-test.js
