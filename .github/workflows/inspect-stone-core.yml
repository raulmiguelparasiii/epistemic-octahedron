name: Implement atlas projection and reciprocal portal

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-stone-core.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch atlas wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          path = Path('philosophers-stone-atlas/index.html')
          s = path.read_text()

          s = replace_once(
              s,
              '''    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f8fafc}
              #boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:14px system-ui,sans-serif;color:#64748b;background:#f8fafc}
          ''',
              '''    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f8fafc}
              #portalPreview{opacity:0;pointer-events:none;z-index:4;background:#000;transition:opacity 80ms linear}
              #portalPreview.is-committing{opacity:1!important;transition:opacity 220ms ease}
              #boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:14px system-ui,sans-serif;color:#64748b;background:#f8fafc}
          ''',
              'portal preview CSS'
          )

          s = replace_once(
              s,
              '''    (async()=>{
                const frame=document.getElementById('appFrame');
                const boot=document.getElementById('boot');
                try{
          ''',
              '''    (async()=>{
                const frame=document.getElementById('appFrame');
                const boot=document.getElementById('boot');
                const params=new URLSearchParams(location.search);
                const portalPreviewMode=params.get('portal-preview')==='1';
                const portalArrival=params.get('portal')==='from42';
                const RETURN_URL='https://raulmiguelparasiii.github.io/42/';
                const PORTAL_PRELOAD_RADIUS=8*Math.PI/180;
                const PORTAL_PREVIEW_RADIUS=4*Math.PI/180;
                const PORTAL_MAX_OPACITY=.52;
                const activePortalPointers=new Set();
                let portalReturnFrame=null;
                let portalTransitioning=false;
                let portalArrivalLocked=portalArrival;
                if(portalPreviewMode||portalArrival) boot.textContent='';

                const clamp01=value=>Math.max(0,Math.min(1,value));
                const smoothstep=value=>value*value*(3-2*value);
                const ensureReturnPreview=()=>{
                  if(portalPreviewMode||portalReturnFrame) return portalReturnFrame;
                  const preview=document.createElement('iframe');
                  preview.id='portalPreview';
                  preview.title='';
                  preview.tabIndex=-1;
                  preview.setAttribute('aria-hidden','true');
                  preview.src=RETURN_URL+'?portal-preview=1';
                  document.body.appendChild(preview);
                  portalReturnFrame=preview;
                  return preview;
                };
                const portalDistance=()=>{
                  try{
                    return frame.contentWindow?.STONE_VIEW?.portalDistance?.()??Infinity;
                  }catch{
                    return Infinity;
                  }
                };
                const updatePortalPreview=()=>{
                  if(portalPreviewMode||portalTransitioning) return;
                  const distance=portalDistance();
                  if(portalArrivalLocked){
                    if(distance>PORTAL_PREVIEW_RADIUS*1.5) portalArrivalLocked=false;
                    if(portalReturnFrame) portalReturnFrame.style.opacity='0';
                    requestAnimationFrame(updatePortalPreview);
                    return;
                  }
                  if(distance<PORTAL_PRELOAD_RADIUS) ensureReturnPreview();
                  const active=activePortalPointers.size>0;
                  const amount=active?clamp01(1-distance/PORTAL_PREVIEW_RADIUS):0;
                  const opacity=PORTAL_MAX_OPACITY*smoothstep(amount);
                  if(portalReturnFrame) portalReturnFrame.style.opacity=String(opacity);
                  requestAnimationFrame(updatePortalPreview);
                };
                const commitReturnPortal=()=>{
                  if(portalPreviewMode||portalArrivalLocked||portalTransitioning) return false;
                  if(portalDistance()>PORTAL_PREVIEW_RADIUS) return false;
                  portalTransitioning=true;
                  const preview=ensureReturnPreview();
                  if(preview){
                    preview.classList.add('is-committing');
                    preview.style.opacity='1';
                  }
                  setTimeout(()=>location.assign(RETURN_URL+'?portal=from-atlas'),230);
                  return true;
                };

                try{
          ''',
              'portal outer state'
          )

          s = replace_once(
              s,
              '''        core=core.replaceAll('EO Mobile Atlas Beta','The Philosopher’s Stone');

                      const equatorAnchor=`octaGroup.add(new THREE.Line(
          ''',
              '''        core=core.replaceAll('EO Mobile Atlas Beta','The Philosopher’s Stone');

                      const cameraAnchor=`    const camera = new THREE.PerspectiveCamera(45, (viewport.clientWidth || window.innerWidth) / (viewport.clientHeight || window.innerHeight), 0.01, 100);`;
                      const cameraReplacement=`    const STONE_ORTHO_BASE_DISTANCE = 4.25;
              const STONE_ORTHO_HALF_HEIGHT = STONE_ORTHO_BASE_DISTANCE * Math.tan(THREE.MathUtils.degToRad(22.5));
              const STONE_ORTHO_INITIAL_ASPECT = (viewport.clientWidth || window.innerWidth) / (viewport.clientHeight || window.innerHeight);
              const camera = new THREE.OrthographicCamera(
                -STONE_ORTHO_HALF_HEIGHT * STONE_ORTHO_INITIAL_ASPECT,
                STONE_ORTHO_HALF_HEIGHT * STONE_ORTHO_INITIAL_ASPECT,
                STONE_ORTHO_HALF_HEIGHT,
                -STONE_ORTHO_HALF_HEIGHT,
                0.01,
                100
              );
              camera.position.set(0, 0, STONE_ORTHO_BASE_DISTANCE);`;
                      if(!core.includes(cameraAnchor)) throw new Error('Perspective camera anchor was not found.');
                      core=core.replace(cameraAnchor,cameraReplacement);

                      const cameraPositionAnchor='      camera.position.set(0, 0, state.distance);';
                      const cameraPositionReplacement=`      camera.position.set(0, 0, STONE_ORTHO_BASE_DISTANCE);
                camera.zoom = STONE_ORTHO_BASE_DISTANCE / state.distance;
                camera.updateProjectionMatrix();`;
                      if(!core.includes(cameraPositionAnchor)) throw new Error('Camera distance anchor was not found.');
                      core=core.replace(cameraPositionAnchor,cameraPositionReplacement);

                      const resizeAnchor=`    function resizeRendererToViewport() {
                const { width, height } = getViewportSize();
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
              }`;
                      const resizeReplacement=`    function resizeRendererToViewport() {
                const { width, height } = getViewportSize();
                const aspect = width / height;
                camera.left = -STONE_ORTHO_HALF_HEIGHT * aspect;
                camera.right = STONE_ORTHO_HALF_HEIGHT * aspect;
                camera.top = STONE_ORTHO_HALF_HEIGHT;
                camera.bottom = -STONE_ORTHO_HALF_HEIGHT;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
              }`;
                      if(!core.includes(resizeAnchor)) throw new Error('Camera resize anchor was not found.');
                      core=core.replace(resizeAnchor,resizeReplacement);

                      const equatorAnchor=`octaGroup.add(new THREE.Line(
          ''',
              'orthographic camera bridge'
          )

          s = replace_once(
              s,
              '''    window.STONE_VIEW={
                request(view,distance){
          ''',
              '''    window.STONE_VIEW={
                portalDistance(){
                  return state.orientation.angleTo(
                    makeCanonicalQuat(Math.PI / 4, Math.asin(1 / Math.sqrt(3)))
                  );
                },
                setPortalOrientation(){
                  state.orientation.copy(
                    makeCanonicalQuat(Math.PI / 4, Math.asin(1 / Math.sqrt(3)))
                  );
                  state.snapQuat=null;
                  state.angularSpeed=0;
                  resetUprightStabilizer();
                  state.panVel.set(0,0,0);
                  state.zoomVel=0;
                  state.target.set(0,0,0);
                  state.distance=4.25;
                  invalidateRender();
                },
                request(view,distance){
          ''',
              'STONE_VIEW portal methods'
          )

          s = replace_once(
              s,
              '''        frame.srcdoc=core;
                      frame.hidden=false;
                      boot.remove();
          ''',
              '''        frame.addEventListener('load',()=>{
                        const inner=frame.contentWindow;
                        if(!inner) return;
                        if(portalPreviewMode||portalArrival){
                          inner.STONE_VIEW?.setPortalOrientation?.();
                        }
                        inner.addEventListener('pointerdown',event=>{
                          activePortalPointers.add(event.pointerId);
                        },true);
                        inner.addEventListener('pointerup',event=>{
                          activePortalPointers.delete(event.pointerId);
                          setTimeout(()=>{
                            if(activePortalPointers.size===0) commitReturnPortal();
                          },0);
                        },true);
                        inner.addEventListener('pointercancel',event=>{
                          activePortalPointers.delete(event.pointerId);
                        },true);
                        if(portalArrival) history.replaceState(null,'',location.pathname);
                      },{once:true});
                      frame.srcdoc=core;
                      frame.hidden=false;
                      boot.remove();
                      if(!portalPreviewMode) requestAnimationFrame(updatePortalPreview);
          ''',
              'atlas portal load bridge'
          )

          path.write_text(s)

          sw = Path('philosophers-stone-atlas/service-worker.js')
          sw_text = sw.read_text()
          sw_text = replace_once(
              sw_text,
              "const CACHE_NAME = 'philosophers-stone-atlas-offline-v1';",
              "const CACHE_NAME = 'philosophers-stone-atlas-offline-v2';",
              'offline cache version'
          )
          sw.write_text(sw_text)

          root = Path('philosophers-stone-atlas')
          names = ['core.01.b64','core.02.b64','core.03.b64','core.04.b64','core.05a.b64','core.05b.b64','core.06.b64','core.07.b64','core.08.b64']
          packed = ''.join((root / name).read_text().strip() for name in names)
          core = gzip.decompress(base64.b64decode(packed)).decode()
          guards = [
              "    const camera = new THREE.PerspectiveCamera(45, (viewport.clientWidth || window.innerWidth) / (viewport.clientHeight || window.innerHeight), 0.01, 100);",
              "      camera.position.set(0, 0, state.distance);",
              """    function resizeRendererToViewport() {
                const { width, height } = getViewportSize();
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
              }"""
          ]
          for guard in guards:
              if core.count(guard) != 1:
                  raise SystemExit('packed core guard mismatch: ' + guard.splitlines()[0])
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-stone-core.yml
          git add philosophers-stone-atlas/index.html philosophers-stone-atlas/service-worker.js
          git diff --cached --check
          git commit -m "Match atlas projection and add reciprocal portal"
          git push
