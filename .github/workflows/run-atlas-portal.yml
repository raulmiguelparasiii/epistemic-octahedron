name: Run corrected atlas projection and portal patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-atlas-portal.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply corrected existing patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/one-shot-atlas-portal-v2.yml')
          raw = source.read_text()
          marker = "          python - <<'PY'\n"
          start = raw.index(marker) + len(marker)
          end = raw.index("\n          PY", start)
          script = textwrap.dedent(raw[start:end])

          guard_start = script.index("\nroot=Path('philosophers-stone-atlas')\n")
          script = script[:guard_start] + "\n"
          exec(compile(script, 'atlas-portal-patch.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Commit implementation and remove patch scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-atlas-portal-v2.yml .github/workflows/run-atlas-portal.yml
          git add philosophers-stone-atlas/index.html philosophers-stone-atlas/service-worker.js
          git diff --cached --check
          git commit -m "Match atlas projection and add reciprocal portal"
          git push
