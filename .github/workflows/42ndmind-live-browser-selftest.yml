name: 42ndMind live browser self-test

on:
  push:
    paths:
      - '42ndmind-live/**'
      - '.github/workflows/42ndmind-live-browser-selftest.yml'
  workflow_dispatch:

jobs:
  browser-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          path: site
      - name: Checkout pinned 42ndMind runtime
        uses: actions/checkout@v4
        with:
          repository: raulmiguelparasiii/42ndMind
          ref: 8a8e25693f9b68b071340b36a99608f5cd8aa815
          path: mind
      - name: Stage exact pinned runtime locally for browser verification
        run: |
          cp -R mind site/42ndmind-live/runtime
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/42ndmind-live/index.html')
          s=p.read_text()
          old="const ROOT=`https://cdn.jsdelivr.net/gh/raulmiguelparasiii/42ndMind@${RUNTIME_SHA}/`;"
          if old not in s:
              raise SystemExit('production runtime ROOT line not found')
          p.write_text(s.replace(old,"const ROOT='./runtime/';"))
          PY
      - name: Start static server
        working-directory: site
        run: |
          python3 -m http.server 8000 >/tmp/42ndmind-http.log 2>&1 &
          sleep 2
      - name: Find Chrome and ChromeDriver
        id: browser
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          DRIVER="$(command -v chromedriver || command -v google-chrome-driver || true)"
          test -n "$CHROME"
          test -n "$DRIVER"
          echo "chrome=$CHROME" >> "$GITHUB_OUTPUT"
          echo "driver=$DRIVER" >> "$GITHUB_OUTPUT"
      - name: Run browser self-test with real time
        env:
          CHROME: ${{ steps.browser.outputs.chrome }}
          DRIVER: ${{ steps.browser.outputs.driver }}
        run: |
          "$DRIVER" --port=9515 --allowed-origins='*' >/tmp/42ndmind-chromedriver.log 2>&1 &
          python3 - <<'PY'
          import json, os, time, urllib.request

          base='http://127.0.0.1:9515'
          def request(method,path,payload=None,timeout=90):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=data,method=method,headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return json.loads(r.read().decode())

          end=time.time()+20
          while True:
              try:
                  if request('GET','/status',timeout=5)['value']['ready']:
                      break
              except Exception:
                  pass
              if time.time()>end:
                  raise SystemExit('chromedriver did not become ready')
              time.sleep(.25)

          session=request('POST','/session',{'capabilities':{'alwaysMatch':{
              'browserName':'chrome',
              'pageLoadStrategy':'none',
              'goog:chromeOptions':{'binary':os.environ['CHROME'],'args':['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--user-data-dir=/tmp/42ndmind-chrome']}
          }}})['value']['sessionId']
          try:
              request('POST',f'/session/{session}/url',{'url':'http://127.0.0.1:8000/42ndmind-live/selftest.html'})
              end=time.time()+120
              while time.time()<end:
                  v=request('POST',f'/session/{session}/execute/sync',{'script':"return {state:document.documentElement.dataset.selftest||'', text:document.getElementById('result')?.textContent||''};",'args':[]})['value']
                  if v['state']=='pass':
                      print(v['text'])
                      break
                  if v['state']=='fail':
                      raise SystemExit(v['text'])
                  time.sleep(.5)
              else:
                  child=request('POST',f'/session/{session}/execute/sync',{'script':"const f=document.getElementById('app'); const d=f?.contentDocument; return {parent:document.getElementById('result')?.textContent||'', runtime:d?.documentElement?.dataset?.runtime||'', runtimeError:d?.documentElement?.dataset?.runtimeError||'', contact:d?.documentElement?.dataset?.lastContact||'', contactError:d?.documentElement?.dataset?.contactError||'', boot:d?.getElementById('boot')?.textContent||''};",'args':[]})['value']
                  raise SystemExit('browser selftest timed out: '+json.dumps(child))
          finally:
              try: request('DELETE',f'/session/{session}',timeout=10)
              except Exception: pass
          PY
