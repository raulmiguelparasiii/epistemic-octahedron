name: Stone doctrine regions test

on:
  push:
    branches: [stone-doctrine-test-20261028]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static validation
        run: |
          set -euo pipefail
          node --check philosophers-stone-atlas/stone-doctrines-v6.js
          grep -Fq "setDoctrineRegion(points)" philosophers-stone-atlas/index.html
          grep -Fq "stoneDoctrinePresentation" philosophers-stone-atlas/index.html
          grep -Fq "stone-doctrines-v6.js" philosophers-stone-atlas/index.html
      - name: Prepare browser harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.56.1 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Browser smoke test
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/stone-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > /tmp/stone-doctrine-test.js <<'NODE'
          const assert=require('assert');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/philosophers-stone-atlas/',{waitUntil:'domcontentloaded',timeout:30000});
            const frame=page.frames().find(f=>f!==page.mainFrame());
            assert(frame,'Stone iframe missing');
            await frame.waitForFunction(()=>window.STONE_VIEW&&window.STONE_DOCTRINES_V6&&document.querySelector('.stone-ref-option[data-ref="doctrines"]'),null,{timeout:25000});

            const state=()=>frame.evaluate(()=>window.STONE_VIEW.getState());
            const point=()=>frame.evaluate(()=>['coord-x','coord-y','coord-z'].map(id=>Number(document.getElementById(id).value)));
            const openItems=()=>frame.locator('#stoneReferentContent .stone-doctrine-item[open]');
            const item=name=>frame.locator(`#stoneReferentContent .stone-doctrine-item[data-doctrine="${name}"]`).first();

            await frame.getByRole('button',{name:'Referent',exact:true}).click();
            await frame.locator('.stone-ref-option[data-ref="doctrines"]').click();
            await frame.waitForSelector('#stoneReferentContent .stone-doctrine-item');
            const before=await point();

            await item('Nihilism').locator('summary').click();
            await frame.waitForTimeout(120);
            assert.strictEqual(await openItems().count(),1,'Only one doctrine should be open');
            let s=await state();
            assert.strictEqual(s.doctrineRegionVisible,true,'Nihilism should show a surface region');
            assert.strictEqual(s.doctrineRegionPointCount,165,'Nihilism region should remain compact');
            assert.strictEqual(s.pointerVisible,false,'Region overlay should hide the plot marker');
            assert.deepStrictEqual(await point(),before,'Opening a doctrine must not move the plotted point');

            await item('Deontology').locator('summary').click();
            await frame.waitForTimeout(120);
            assert.strictEqual(await openItems().count(),1,'Opening Deontology should close Nihilism');
            assert.strictEqual(await openItems().first().getAttribute('data-doctrine'),'Deontology');
            s=await state();
            assert.strictEqual(s.doctrineRegionVisible,true,'Deontology should show compact loci');
            assert.strictEqual(s.doctrineRegionPointCount,62,'Deontology should use two small loci rather than a broad half-surface');
            assert.strictEqual(s.pointerVisible,false);

            await item('Existentialism').locator('summary').click();
            await frame.waitForTimeout(120);
            assert.strictEqual(await openItems().count(),1,'Existentialism should be the only open item');
            s=await state();
            assert.strictEqual(s.doctrineRegionVisible,false,'Existentialism should not fabricate a fixed region');
            assert.strictEqual(s.doctrineRegionPointCount,0);
            assert.strictEqual(s.pointerVisible,true,'No-region doctrine should leave the normal marker available');

            await item('Nihilism').locator('summary').click();
            await frame.waitForTimeout(80);
            await frame.evaluate(()=>window.postMessage({type:'set-profile',data:{data:{point:{x:.5,y:.5,z:0}}}},'*'));
            await frame.waitForTimeout(180);
            assert.strictEqual(await openItems().count(),1,'Open doctrine should survive coordinate rerender');
            assert.strictEqual(await openItems().first().getAttribute('data-doctrine'),'Nihilism');
            s=await state();
            assert.strictEqual(s.doctrineRegionVisible,true,'Region should survive coordinate rerender');
            assert.strictEqual(s.pointerVisible,false);

            await frame.locator('.stone-ref-option[data-ref="communication"]').click();
            await frame.waitForTimeout(120);
            s=await state();
            assert.strictEqual(s.doctrineRegionVisible,false,'Leaving Doctrines should clear the region');
            assert.strictEqual(s.doctrineRegionPointCount,0);
            assert.strictEqual(s.pointerVisible,true,'Leaving Doctrines should restore the plot marker');

            if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
            await browser.close();
            console.log('Doctrine region smoke test passed.');
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
          NODE_PATH="$PWD/node_modules" timeout 75s node /tmp/stone-doctrine-test.js
