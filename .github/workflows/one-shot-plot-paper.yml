name: One-shot Plot paper interface
on:
  push:
    paths:
      - '.github/workflows/one-shot-plot-paper.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Plot paper patch
        run: python .github/plot_paper_patch.py
      - name: Commit and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add philosophers-stone-atlas/stone-ui-v2.js philosophers-stone-atlas/index.html
          git commit -m 'Update Plot semantics and add current paper'
          git rm .github/workflows/one-shot-plot-paper.yml .github/plot_paper_patch.py
          git commit -m 'Remove one-shot Plot paper patch files'
          git push
