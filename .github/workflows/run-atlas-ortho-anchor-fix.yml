name: Run validated Atlas orthographic anchor fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-atlas-ortho-anchor-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct and validate packed-core resize anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          p=Path('philosophers-stone-atlas/index.html')
          s=p.read_text()
          current=(
              "const resizeAnchor=`    function resizeRendererToViewport() {\n"
              "  const { width, height } = getViewportSize();\n"
              "  camera.aspect = width / height;\n"
              "  camera.updateProjectionMatrix();\n"
              "  renderer.setSize(width, height);\n"
              "}`;\n"
              "const resizeReplacement=`    function resizeRendererToViewport() {\n"
              "  const { width, height } = getViewportSize();\n"
              "  const aspect = width / height;\n"
              "  camera.left = -STONE_ORTHO_HALF_HEIGHT * aspect;\n"
              "  camera.right = STONE_ORTHO_HALF_HEIGHT * aspect;\n"
              "  camera.top = STONE_ORTHO_HALF_HEIGHT;\n"
              "  camera.bottom = -STONE_ORTHO_HALF_HEIGHT;\n"
              "  camera.updateProjectionMatrix();\n"
              "  renderer.setSize(width, height);\n"
              "}`;"
          )
          corrected=(
              "const resizeAnchor=`    function resizeRendererToViewport() {\n"
              "      const { width, height } = getViewportSize();\n"
              "      camera.aspect = width / height;\n"
              "      camera.updateProjectionMatrix();\n"
              "      renderer.setSize(width, height);\n"
              "    }`;\n"
              "const resizeReplacement=`    function resizeRendererToViewport() {\n"
              "      const { width, height } = getViewportSize();\n"
              "      const aspect = width / height;\n"
              "      camera.left = -STONE_ORTHO_HALF_HEIGHT * aspect;\n"
              "      camera.right = STONE_ORTHO_HALF_HEIGHT * aspect;\n"
              "      camera.top = STONE_ORTHO_HALF_HEIGHT;\n"
              "      camera.bottom = -STONE_ORTHO_HALF_HEIGHT;\n"
              "      camera.updateProjectionMatrix();\n"
              "      renderer.setSize(width, height);\n"
              "    }`;"
          )
          if s.count(current)!=1:
              raise SystemExit(f'expected one dedented resize wrapper, found {s.count(current)}')
          p.write_text(s.replace(current,corrected,1))
          sw=Path('philosophers-stone-atlas/service-worker.js')
          sws=sw.read_text()
          if sws.count('philosophers-stone-atlas-offline-v2')!=1:
              raise SystemExit('expected service-worker cache v2 exactly once')
          sw.write_text(sws.replace('philosophers-stone-atlas-offline-v2','philosophers-stone-atlas-offline-v3',1))
          root=Path('philosophers-stone-atlas')
          names=['core.01.b64','core.02.b64','core.03.b64','core.04.b64','core.05a.b64','core.05b.b64','core.06.b64','core.07.b64','core.08.b64']
          packed=''.join((root/name).read_text().strip() for name in names)
          core=gzip.decompress(base64.b64decode(packed)).decode()
          exact_resize=(
              "    function resizeRendererToViewport() {\n"
              "      const { width, height } = getViewportSize();\n"
              "      camera.aspect = width / height;\n"
              "      camera.updateProjectionMatrix();\n"
              "      renderer.setSize(width, height);\n"
              "    }"
          )
          exact_camera="    const camera = new THREE.PerspectiveCamera(45, (viewport.clientWidth || window.innerWidth) / (viewport.clientHeight || window.innerHeight), 0.01, 100);"
          exact_position="      camera.position.set(0, 0, state.distance);"
          for label,anchor in [('resize',exact_resize),('camera',exact_camera),('position',exact_position)]:
              if core.count(anchor)!=1:
                  raise SystemExit(f'{label} packed-core anchor mismatch: {core.count(anchor)}')
          fixed=p.read_text()
          if corrected not in fixed:
              raise SystemExit('corrected resize wrapper was not written')
          PY
      - name: Commit fix and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-atlas-ortho-anchor.yml .github/workflows/run-atlas-ortho-anchor-fix.yml
          git add philosophers-stone-atlas/index.html philosophers-stone-atlas/service-worker.js
          git diff --cached --check
          git commit -m "Fix Atlas orthographic runtime anchor"
          git push
