name: One-shot hybrid Stone transition

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-hybrid-transition.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hybrid transition
        run: python .tmp_hybrid_transition_patch.py
      - name: Validate runtime patch anchors
        run: |
          python - <<'PY'
          import base64,gzip
          from pathlib import Path
          p=Path('philosophers-stone-atlas/index.html').read_text()
          required=[
            'const STONE_NATIVE_FOV = 45;',
            'const STONE_SEAM_FOV = 1.15;',
            'const STONE_RETURN_SPIN_MIN=0.040;',
            'stoneArmReturnFromThrow()',
            'applyStonePortalDynamics();',
            "returnAmount:stoneReturnAmount()",
            "philosophers-stone-atlas-offline-v6",
          ]
          combined=p+Path('philosophers-stone-atlas/service-worker.js').read_text()
          for token in required:
            if token not in combined: raise SystemExit(f'missing {token}')
          root=Path('philosophers-stone-atlas')
          names=['core.01.b64','core.02.b64','core.03.b64','core.04.b64','core.05a.b64','core.05b.b64','core.06.b64','core.07.b64','core.08.b64']
          core=gzip.decompress(base64.b64decode(''.join((root/n).read_text().strip() for n in names))).decode()
          anchors=[
            "    const camera = new THREE.PerspectiveCamera(45, (viewport.clientWidth || window.innerWidth) / (viewport.clientHeight || window.innerHeight), 0.01, 100);",
            "      camera.position.set(0, 0, state.distance);",
            "      state.zoomVel *= ZOOM_DAMP;\n\n      syncSceneMatrices();",
            "    function settleThrowAfterRelease() {\n      const topBottom = getTopBottomSnapInfo();",
            "    renderer.domElement.addEventListener('pointerdown', (e) => {\n      rememberPointer(e);",
            "        viewport.classList.remove('rotating');\n        maybeSnapView();",
            "      const moving =\n        state.rotating ||",
          ]
          for anchor in anchors:
            c=core.count(anchor)
            if c != 1: raise SystemExit(f'core anchor count {c}: {anchor[:70]}')
          print('Hybrid transition validation passed.')
          PY
      - name: Commit implementation and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .tmp_hybrid_transition_patch.py .github/workflows/one-shot-hybrid-transition.yml .github/workflows/inspect-stone-core.yml
          git add philosophers-stone-atlas/index.html philosophers-stone-atlas/service-worker.js
          git commit -m 'Restore perspective Atlas with momentum return'
          git push
