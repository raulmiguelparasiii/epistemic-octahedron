<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EO Mobile Atlas Beta</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fafc}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f8fafc}
    #boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:14px system-ui,sans-serif;color:#64748b;background:#f8fafc}
  </style>
</head>
<body>
  <div id="boot">Loading EO Mobile Atlas Beta…</div>
  <iframe id="appFrame" title="EO Mobile Atlas Beta" hidden></iframe>
  <script>
    (async()=>{
      const frame=document.getElementById('appFrame');
      const boot=document.getElementById('boot');
      try{
        if(!('DecompressionStream' in window)) throw new Error('This browser does not support DecompressionStream.');
        const names=[
          'core.01.b64','core.02.b64','core.03.b64','core.04.b64',
          'core.05a.b64','core.05b.b64',
          'core.06.b64','core.07.b64','core.08.b64'
        ];
        const parts=await Promise.all(names.map(async name=>{
          const response=await fetch(name,{cache:'no-store'});
          if(!response.ok) throw new Error(`Could not load ${name}`);
          return (await response.text()).trim();
        }));
        const packed=parts.join('');
        const bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        let core=await new Response(stream).text();

        core=core.replace(
          '.question-package-row select { min-width:0; flex:1 1 140px; border:1px solid var(--border); background:#fff; border-radius:12px; padding:7px 8px; font:inherit; font-size:11px; }',
`          .question-package-row select { min-width:0; flex:1 1 140px; border:1px solid var(--border); background:#fff; border-radius:12px; padding:7px 8px; font:inherit; font-size:11px; }
    .editor-profile-box{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:end;margin:7px 0}.editor-profile-box label{min-width:0}.editor-profile-box input{width:100%;min-width:0;border:1px solid var(--border);background:#fff;border-radius:12px;padding:8px 9px;font:inherit;font-size:12px}.editor-profile-box .profile-label{display:block;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 4px 3px}`
        );

        core=core.replace(
`          <div class="instrument-toolbar">
            <select id="editorPackageSelect" aria-label="Package"></select>
            <button id="newPackageBtn" type="button">New</button>
            <label class="editor-file-label" for="packageImportInput">Import</label><input id="packageImportInput" class="editor-file-input" type="file" accept="application/json,.json" />
            <button id="packageExportBtn" type="button">Export</button>
          </div>`,
`          <div class="instrument-toolbar">
            <select id="editorPackageSelect" aria-label="Profile"></select>
            <button id="newPackageBtn" type="button">+ Profile</button>
            <button id="addQuestionTopBtn" type="button">+ Question</button>
            <label class="editor-file-label" for="packageImportInput">Import</label><input id="packageImportInput" class="editor-file-input" type="file" accept="application/json,.json" />
            <button id="packageExportBtn" type="button">Export</button>
          </div>
          <div class="editor-profile-box">
            <label><span class="profile-label">Profile name</span><input id="editorPackageName" type="text" autocomplete="off"></label>
            <div class="instrument-toolbar"><button id="savePackageNameBtn" type="button">Save</button><button id="deletePackageBtn" type="button">Delete</button></div>
          </div>`
        );

        core=core.replace(
          "    const packageExportBtn = document.getElementById('packageExportBtn');",
`    const packageExportBtn = document.getElementById('packageExportBtn');
    const addQuestionTopBtn = document.getElementById('addQuestionTopBtn');
    const editorPackageName = document.getElementById('editorPackageName');
    const savePackageNameBtn = document.getElementById('savePackageNameBtn');
    const deletePackageBtn = document.getElementById('deletePackageBtn');`
        );

        core=core.replace(
          `const q=editorQuestion(); if(!q){editorQuestionFields.innerHTML='<p class="editor-note">Add a question to begin.</p>';return;}`,
          `const q=editorQuestion(); if(!q){editorQuestionFields.innerHTML='<p class="editor-note">This profile has no questions yet.</p><div class="instrument-toolbar"><button id="emptyAddQuestionBtn" type="button">+ Add first question</button></div>';document.getElementById('emptyAddQuestionBtn').onclick=addQuestion;return;}`
        );

        core=core.replace(
          "function renderEditorUI(){ syncPackageSelects(); const q=editorQuestion(),counts=mappingCounts(q); editorYesCount.textContent=counts.yes;editorNoCount.textContent=counts.no;editorBlankCount.textContent=counts.blank;document.querySelectorAll('[data-paint]').forEach(b=>b.classList.toggle('active',b.dataset.paint===instrumentState.paintMode));renderEditorTree();renderQuestionFields();renderSelectedCoordinate();renderInterpretations(); }",
          "function renderEditorUI(){ syncPackageSelects(); const p=activePackage(),q=editorQuestion(),counts=mappingCounts(q); editorPackageName.value=p?.name||''; deletePackageBtn.disabled=!p; editorYesCount.textContent=counts.yes;editorNoCount.textContent=counts.no;editorBlankCount.textContent=counts.blank;document.querySelectorAll('[data-paint]').forEach(b=>b.classList.toggle('active',b.dataset.paint===instrumentState.paintMode));renderEditorTree();renderQuestionFields();renderSelectedCoordinate();renderInterpretations(); }"
        );

        core=core.replace(
          "function newPackage(){const p={id:qid('pkg'),name:'New question package',description:'',questions:[],interpretations:[]};instrumentState.packages.push(p);instrumentState.packageId=p.id;instrumentState.editorQuestionId='';syncPackageSelects();renderEditorUI();resetBinaryDiagnostic();}",
`function newPackage(){const p={id:qid('pkg'),name:'New question package',description:'',questions:[],interpretations:[]};instrumentState.packages.push(p);instrumentState.packageId=p.id;instrumentState.editorQuestionId='';syncPackageSelects();renderEditorUI();resetBinaryDiagnostic();}
    function savePackageName(){const p=activePackage();if(!p)return;const name=editorPackageName.value.trim();if(name)p.name=name;syncPackageSelects();renderEditorUI();renderBinaryDiagnostic();}
    function deletePackage(){const p=activePackage();if(!p)return;if(!confirm('Delete profile "'+p.name+'"?'))return;instrumentState.packages=instrumentState.packages.filter(x=>x!==p);if(!instrumentState.packages.length)instrumentState.packages.push({id:qid('pkg'),name:'New question package',description:'',questions:[],interpretations:[]});instrumentState.packageId=instrumentState.packages[0].id;instrumentState.editorQuestionId=activePackage().questions[0]?.id||'';instrumentState.selectedCoordinate='';resetBinaryDiagnostic();renderEditorUI();updateInstrumentMarkers();}`
        );

        core=core.replace(
          "    newPackageBtn.addEventListener('click', newPackage);",
`    newPackageBtn.addEventListener('click', newPackage);
    addQuestionTopBtn.addEventListener('click', addQuestion);
    savePackageNameBtn.addEventListener('click', savePackageName);
    editorPackageName.addEventListener('keydown', e=>{if(e.key==='Enter'){e.preventDefault();savePackageName();}});
    deletePackageBtn.addEventListener('click', deletePackage);`
        );

        core=core.replace('.legend-dot.blank{background:#94a3b8}', '.legend-dot.blank{background:#111111}');

        const markerBlock=/const editorMarkerGeom = new THREE\.SphereGeometry\(0\.026, 10, 7\);[\s\S]*?editorMarkers\.visible=false; editorMarkers\.renderOrder=7; octaGroup\.add\(editorMarkers\);/;
        const markerReplacement=`const editorMarkerGeom = new THREE.SphereGeometry(0.028, 10, 7);
    const editorMarkerDummy = new THREE.Object3D();
    function makeEditorMarkerLayer(color){
      const material=new THREE.MeshBasicMaterial({color,depthTest:true,depthWrite:false,transparent:true,opacity:1});
      const mesh=new THREE.InstancedMesh(editorMarkerGeom,material,eoTenthsCoordinates.length);
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      mesh.frustumCulled=false;
      for(let i=0;i<eoTenthsCoordinates.length;i++){
        const c=eoTenthsCoordinates[i],p=new THREE.Vector3(c.x,c.y,c.z),n=getOctaSurfaceNormal(p);
        editorMarkerDummy.position.copy(p).addScaledVector(n,0.024);
        editorMarkerDummy.scale.setScalar(0.001);
        editorMarkerDummy.updateMatrix();
        mesh.setMatrixAt(i,editorMarkerDummy.matrix);
      }
      mesh.instanceMatrix.needsUpdate=true;
      mesh.visible=false;
      mesh.renderOrder=7;
      octaGroup.add(mesh);
      return mesh;
    }
    const editorMarkerLayers={
      yes:makeEditorMarkerLayer(0x22c55e),
      no:makeEditorMarkerLayer(0xef4444),
      blank:makeEditorMarkerLayer(0x111111),
      possible:makeEditorMarkerLayer(0x2563eb),
      ruled:makeEditorMarkerLayer(0xcbd5e1)
    };`;
        if(!markerBlock.test(core)) throw new Error('Editor marker block patch did not match.');
        core=core.replace(markerBlock,markerReplacement);

        const updateBlock=/function updateInstrumentMarkers\(\)\{[\s\S]*?\n    \}\n\n    function localMarkerPoint/;
        const updateReplacement=`function updateInstrumentMarkers(){
      const mode=state.uiMode,q=editorQuestion(),cand=instrumentState.diagnostic.candidates;
      const inEditor=mode==='editor',inQuestions=mode==='questions';
      const layers=editorMarkerLayers;
      for(const layer of Object.values(layers)) layer.visible=false;
      selectedHalo.visible=false; yesFinalHalo.visible=false; noFinalHalo.visible=false;
      if(!inEditor&&!inQuestions){ invalidateRender(); return; }
      if(inEditor){ layers.yes.visible=true; layers.no.visible=true; layers.blank.visible=true; }
      else { layers.possible.visible=true; layers.ruled.visible=true; }
      const activeScale={yes:1.18,no:1.18,blank:0.68,possible:1.0,ruled:0.58};
      for(let i=0;i<eoTenthsCoordinates.length;i++){
        const c=eoTenthsCoordinates[i],p=new THREE.Vector3(c.x,c.y,c.z),n=getOctaSurfaceNormal(p);
        let active='blank';
        if(inEditor){ const a=assignmentOf(q,c.coordinate); active=a==='yes'?'yes':a==='no'?'no':'blank'; }
        else active=cand.has(c.coordinate)?'possible':'ruled';
        for(const [name,layer] of Object.entries(layers)){
          if(!layer.visible) continue;
          editorMarkerDummy.position.copy(p).addScaledVector(n,0.024);
          editorMarkerDummy.scale.setScalar(name===active?activeScale[name]:0.001);
          editorMarkerDummy.updateMatrix();
          layer.setMatrixAt(i,editorMarkerDummy.matrix);
        }
      }
      for(const layer of Object.values(layers)) if(layer.visible) layer.instanceMatrix.needsUpdate=true;
      if(inEditor){
        if(instrumentState.selectedCoordinate) placeHalo(selectedHalo,instrumentState.selectedCoordinate);
        if(q?.finalYes) placeHalo(yesFinalHalo,q.finalYes);
        if(q?.finalNo) placeHalo(noFinalHalo,q.finalNo);
      }
      invalidateRender();
    }

    function localMarkerPoint`;
        if(!updateBlock.test(core)) throw new Error('Editor marker update patch did not match.');
        core=core.replace(updateBlock,updateReplacement);

        const diagnosticBlock=/    function candidateSplit\(q,candidates\)\{[\s\S]*?\n    function escapeHtml/;
        const diagnosticReplacement=`    function candidateSplit(q,candidates){ let yes=[],no=[],blank=[]; for(const key of candidates){const a=assignmentOf(q,key);(a==='yes'?yes:a==='no'?no:blank).push(key);}return{yes,no,blank}; }
    function validFinalKey(key){ return !!key && eoCoordByKey.has(key); }
    function directFinalQuestion(q){
      const hasAssignments=!!Object.keys(q.assignments||{}).length;
      return !hasAssignments && validFinalKey(q.finalYes) && validFinalKey(q.finalNo) && q.finalYes!==q.finalNo;
    }
    function branchResult(q,value,split){
      const finalKey=value?q.finalYes:q.finalNo;
      if(validFinalKey(finalKey)) return {terminal:true,finalKey,keep:[finalKey]};
      return {terminal:false,finalKey:'',keep:value?split.yes:split.no};
    }
    function nextBinaryQuestion(){
      const candidates=instrumentState.diagnostic.candidates, used=new Set(instrumentState.diagnostic.answers.map(a=>a.qid)); let best=null;
      for(const q of activePackage().questions){
        if(used.has(q.id)||instrumentState.diagnostic.skipped.has(q.id))continue;
        const s=candidateSplit(q,candidates),direct=directFinalQuestion(q);
        if(!direct&&(s.blank.length||!s.yes.length||!s.no.length))continue;
        const yr=branchResult(q,true,s),nr=branchResult(q,false,s);
        if(!yr.keep.length||!nr.keep.length)continue;
        const ySize=yr.terminal?1:yr.keep.length,nSize=nr.terminal?1:nr.keep.length;
        const worst=Math.max(ySize,nSize), imbalance=Math.abs(ySize-nSize);
        if(!best||worst<best.worst||(worst===best.worst&&imbalance<best.imbalance))best={q,s,yr,nr,worst,imbalance,direct};
      }
      return best;
    }
    function answerBinary(value){
      const next=nextBinaryQuestion(); if(!next)return; const result=value?next.yr:next.nr;
      instrumentState.diagnostic.answers.push({qid:next.q.id,answer:value,text:next.q.text,finalCoordinate:result.terminal?result.finalKey:''});
      instrumentState.diagnostic.candidates=new Set(result.keep); renderBinaryDiagnostic(); updateInstrumentMarkers();
    }
    function undoBinary(){
      if(!instrumentState.diagnostic.answers.length)return;
      instrumentState.diagnostic.answers.pop(); const set=new Set(eoTenthsCoordinates.map(c=>c.coordinate));
      for(const a of instrumentState.diagnostic.answers){
        const q=activePackage().questions.find(q=>q.id===a.qid);if(!q)continue;
        const s=candidateSplit(q,set),result=branchResult(q,a.answer,s); set.clear(); result.keep.forEach(k=>set.add(k));
        if(result.terminal)break;
      }
      instrumentState.diagnostic.candidates=set;renderBinaryDiagnostic();updateInstrumentMarkers();
    }
    function renderBinaryDiagnostic(){
      syncPackageSelects(); const cand=instrumentState.diagnostic.candidates; questionProgressEl.textContent=instrumentState.diagnostic.answers.length+' answered'; questionStatusEl.textContent=String(cand.size); questionUndoBtn.disabled=!instrumentState.diagnostic.answers.length; questionPathEl.hidden=!instrumentState.diagnostic.pathVisible; questionPathEl.style.display=instrumentState.diagnostic.pathVisible?'grid':'none'; questionPathToggleBtn.textContent=instrumentState.diagnostic.pathVisible?'Hide path':'Path'; questionAnswersEl.innerHTML='';
      questionPathEl.innerHTML=instrumentState.diagnostic.answers.map((a,i)=>'<div>'+(i+1)+'. '+(a.answer?'YES':'NO')+' · '+a.text+(a.finalCoordinate?' → '+a.finalCoordinate:'')+'</div>').join('');
      if(cand.size===1){ const key=[...cand][0],c=eoCoordByKey.get(key),over=packageInterpretation(c); questionIdEl.textContent='complete'; questionTextEl.textContent=over?.title||c.label; questionCandidateSummary.textContent=over?.text||c.meaning; return; }
      const next=nextBinaryQuestion(); if(!next){ questionIdEl.textContent='paused'; questionTextEl.textContent='No eligible binary question can split the remaining coordinates.'; questionCandidateSummary.textContent=cand.size+' coordinates remain. Either assign YES/NO for every currently possible point on another question, or set both YES final and NO final on an otherwise unmapped question for a direct two-outcome package.'; return; }
      const yLabel=next.yr.terminal?'YES → '+next.yr.finalKey:'YES keeps '+next.yr.keep.length;
      const nLabel=next.nr.terminal?'NO → '+next.nr.finalKey:'NO keeps '+next.nr.keep.length;
      questionIdEl.textContent=next.q.id; questionTextEl.textContent=next.q.text; questionCandidateSummary.textContent=yLabel+' · '+nLabel+(next.direct?' · direct final split':' · selected by smallest worst branch ('+next.worst+')')+'.';
      const y=document.createElement('button');y.type='button';y.innerHTML='<span class="answer-label">Yes</span>';y.addEventListener('click',()=>answerBinary(true));const n=document.createElement('button');n.type='button';n.innerHTML='<span class="answer-label">No</span>';n.addEventListener('click',()=>answerBinary(false));questionAnswersEl.append(y,n);
    }

    function escapeHtml`;
        if(!diagnosticBlock.test(core)) throw new Error('Binary diagnostic patch did not match.');
        core=core.replace(diagnosticBlock,diagnosticReplacement);

        frame.srcdoc=core;
        frame.hidden=false;
        boot.remove();
      }catch(err){
        boot.textContent='EO Mobile Atlas Beta could not start: '+err.message;
      }
    })();
  </script>
</body>
</html>
