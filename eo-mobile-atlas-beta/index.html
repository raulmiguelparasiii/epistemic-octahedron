<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EO Mobile Atlas Beta</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fafc}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f8fafc}
    #boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:14px system-ui,sans-serif;color:#64748b;background:#f8fafc}
  </style>
</head>
<body>
  <div id="boot">Loading EO Mobile Atlas Beta…</div>
  <iframe id="appFrame" title="EO Mobile Atlas Beta" hidden></iframe>
  <script>
    (async()=>{
      const frame=document.getElementById('appFrame');
      const boot=document.getElementById('boot');
      try{
        if(!('DecompressionStream' in window)) throw new Error('This browser does not support DecompressionStream.');
        const names=[
          'core.01.b64','core.02.b64','core.03.b64','core.04.b64',
          'core.05a.b64','core.05b.b64',
          'core.06.b64','core.07.b64','core.08.b64'
        ];
        const parts=await Promise.all(names.map(async name=>{
          const response=await fetch(name,{cache:'no-store'});
          if(!response.ok) throw new Error(`Could not load ${name}`);
          return (await response.text()).trim();
        }));
        const packed=parts.join('');
        const bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        let core=await new Response(stream).text();

        core=core.replace('.legend-dot.blank{background:#94a3b8}', '.legend-dot.blank{background:#111111}');

        const markerBlock=/const editorMarkerGeom = new THREE\.SphereGeometry\(0\.026, 10, 7\);[\s\S]*?editorMarkers\.visible=false; editorMarkers\.renderOrder=7; octaGroup\.add\(editorMarkers\);/;
        const markerReplacement=`const editorMarkerGeom = new THREE.SphereGeometry(0.028, 10, 7);
    const editorMarkerDummy = new THREE.Object3D();
    function makeEditorMarkerLayer(color){
      const material=new THREE.MeshBasicMaterial({color,depthTest:true,depthWrite:false,transparent:true,opacity:1});
      const mesh=new THREE.InstancedMesh(editorMarkerGeom,material,eoTenthsCoordinates.length);
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      mesh.frustumCulled=false;
      for(let i=0;i<eoTenthsCoordinates.length;i++){
        const c=eoTenthsCoordinates[i],p=new THREE.Vector3(c.x,c.y,c.z),n=getOctaSurfaceNormal(p);
        editorMarkerDummy.position.copy(p).addScaledVector(n,0.024);
        editorMarkerDummy.scale.setScalar(0.001);
        editorMarkerDummy.updateMatrix();
        mesh.setMatrixAt(i,editorMarkerDummy.matrix);
      }
      mesh.instanceMatrix.needsUpdate=true;
      mesh.visible=false;
      mesh.renderOrder=7;
      octaGroup.add(mesh);
      return mesh;
    }
    const editorMarkerLayers={
      yes:makeEditorMarkerLayer(0x22c55e),
      no:makeEditorMarkerLayer(0xef4444),
      blank:makeEditorMarkerLayer(0x111111),
      possible:makeEditorMarkerLayer(0x2563eb),
      ruled:makeEditorMarkerLayer(0xcbd5e1)
    };`;
        if(!markerBlock.test(core)) throw new Error('Editor marker block patch did not match.');
        core=core.replace(markerBlock,markerReplacement);

        const updateBlock=/function updateInstrumentMarkers\(\)\{[\s\S]*?\n    \}\n\n    function localMarkerPoint/;
        const updateReplacement=`function updateInstrumentMarkers(){
      const mode=state.uiMode,q=editorQuestion(),cand=instrumentState.diagnostic.candidates;
      const inEditor=mode==='editor',inQuestions=mode==='questions';
      const layers=editorMarkerLayers;
      for(const layer of Object.values(layers)) layer.visible=false;
      selectedHalo.visible=false; yesFinalHalo.visible=false; noFinalHalo.visible=false;
      if(!inEditor&&!inQuestions){ invalidateRender(); return; }
      if(inEditor){ layers.yes.visible=true; layers.no.visible=true; layers.blank.visible=true; }
      else { layers.possible.visible=true; layers.ruled.visible=true; }
      const activeScale={yes:1.18,no:1.18,blank:0.68,possible:1.0,ruled:0.58};
      for(let i=0;i<eoTenthsCoordinates.length;i++){
        const c=eoTenthsCoordinates[i],p=new THREE.Vector3(c.x,c.y,c.z),n=getOctaSurfaceNormal(p);
        let active='blank';
        if(inEditor){ const a=assignmentOf(q,c.coordinate); active=a==='yes'?'yes':a==='no'?'no':'blank'; }
        else active=cand.has(c.coordinate)?'possible':'ruled';
        for(const [name,layer] of Object.entries(layers)){
          if(!layer.visible) continue;
          editorMarkerDummy.position.copy(p).addScaledVector(n,0.024);
          editorMarkerDummy.scale.setScalar(name===active?activeScale[name]:0.001);
          editorMarkerDummy.updateMatrix();
          layer.setMatrixAt(i,editorMarkerDummy.matrix);
        }
      }
      for(const layer of Object.values(layers)) if(layer.visible) layer.instanceMatrix.needsUpdate=true;
      if(inEditor){
        if(instrumentState.selectedCoordinate) placeHalo(selectedHalo,instrumentState.selectedCoordinate);
        if(q?.finalYes) placeHalo(yesFinalHalo,q.finalYes);
        if(q?.finalNo) placeHalo(noFinalHalo,q.finalNo);
      }
      invalidateRender();
    }

    function localMarkerPoint`;
        if(!updateBlock.test(core)) throw new Error('Editor marker update patch did not match.');
        core=core.replace(updateBlock,updateReplacement);

        frame.srcdoc=core;
        frame.hidden=false;
        boot.remove();
      }catch(err){
        boot.textContent='EO Mobile Atlas Beta could not start: '+err.message;
      }
    })();
  </script>
</body>
</html>
