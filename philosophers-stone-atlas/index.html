<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <link rel="manifest" href="manifest.webmanifest">
  <title>The Philosopher's Stone</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fafc}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f8fafc}
    #portalPreview{opacity:0;pointer-events:none;z-index:4;background:#000;transition:opacity 80ms linear}
#portalPreview.is-committing{opacity:1!important;transition:opacity 220ms ease}
    #boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:14px system-ui,sans-serif;color:#64748b;background:#f8fafc}
  </style>
</head>
<body>
  <div id="boot">Loading The Philosopher's Stone…</div>
  <iframe id="appFrame" title="The Philosopher's Stone" hidden></iframe>
  <script>
    (async()=>{
      const frame=document.getElementById('appFrame');
      const boot=document.getElementById('boot');
const params=new URLSearchParams(location.search);
const portalPreviewMode=params.get('portal-preview')==='1';
const portalArrival=params.get('portal')==='from42';
const RETURN_URL='https://raulmiguelparasiii.github.io/42/';
const PORTAL_PRELOAD_RADIUS=8*Math.PI/180;
const PORTAL_PREVIEW_RADIUS=4*Math.PI/180;
const PORTAL_MAX_OPACITY=.52;
const activePortalPointers=new Set();
let portalReturnFrame=null;
let portalTransitioning=false;
let portalArrivalLocked=portalArrival;
if(portalPreviewMode||portalArrival) boot.textContent='';

const clamp01=value=>Math.max(0,Math.min(1,value));
const smoothstep=value=>value*value*(3-2*value);
const ensureReturnPreview=()=>{
  if(portalPreviewMode||portalReturnFrame) return portalReturnFrame;
  const preview=document.createElement('iframe');
  preview.id='portalPreview';
  preview.title='';
  preview.tabIndex=-1;
  preview.setAttribute('aria-hidden','true');
  preview.src=RETURN_URL+'?portal-preview=1';
  document.body.appendChild(preview);
  portalReturnFrame=preview;
  return preview;
};
const portalDistance=()=>{
  try{
    return frame.contentWindow?.STONE_VIEW?.portalDistance?.()??Infinity;
  }catch{
    return Infinity;
  }
};
const updatePortalPreview=()=>{
  if(portalPreviewMode||portalTransitioning) return;
  const distance=portalDistance();
  if(portalArrivalLocked){
    if(distance>PORTAL_PREVIEW_RADIUS*1.5) portalArrivalLocked=false;
    if(portalReturnFrame) portalReturnFrame.style.opacity='0';
    requestAnimationFrame(updatePortalPreview);
    return;
  }
  if(distance<PORTAL_PRELOAD_RADIUS) ensureReturnPreview();
  const active=activePortalPointers.size>0;
  const amount=active?clamp01(1-distance/PORTAL_PREVIEW_RADIUS):0;
  const opacity=PORTAL_MAX_OPACITY*smoothstep(amount);
  if(portalReturnFrame) portalReturnFrame.style.opacity=String(opacity);
  requestAnimationFrame(updatePortalPreview);
};
const commitReturnPortal=()=>{
  if(portalPreviewMode||portalArrivalLocked||portalTransitioning) return false;
  if(portalDistance()>PORTAL_PREVIEW_RADIUS) return false;
  portalTransitioning=true;
  const preview=ensureReturnPreview();
  if(preview){
    preview.classList.add('is-committing');
    preview.style.opacity='1';
  }
  setTimeout(()=>location.assign(RETURN_URL+'?portal=from-atlas'),230);
  return true;
};
      try{
        if(!('DecompressionStream' in window)) throw new Error('This browser does not support DecompressionStream.');
        const names=['core.01.b64','core.02.b64','core.03.b64','core.04.b64','core.05a.b64','core.05b.b64','core.06.b64','core.07.b64','core.08.b64'];
        const parts=await Promise.all(names.map(async name=>{
          const response=await fetch(name,{cache:'no-store'});
          if(!response.ok) throw new Error(`Could not load ${name}`);
          return (await response.text()).trim();
        }));
        const packed=parts.join('');
        const bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        let core=await new Response(stream).text();
        core=core.replaceAll('Epistemic Octahedron','The Philosopher’s Stone');
        core=core.replaceAll('EO Mobile Atlas Beta','The Philosopher’s Stone');

const cameraAnchor=`    const camera = new THREE.PerspectiveCamera(45, (viewport.clientWidth || window.innerWidth) / (viewport.clientHeight || window.innerHeight), 0.01, 100);`;
const cameraReplacement=`    const STONE_ORTHO_BASE_DISTANCE = 4.25;
const STONE_ORTHO_HALF_HEIGHT = STONE_ORTHO_BASE_DISTANCE * Math.tan(THREE.MathUtils.degToRad(22.5));
const STONE_ORTHO_INITIAL_ASPECT = (viewport.clientWidth || window.innerWidth) / (viewport.clientHeight || window.innerHeight);
const camera = new THREE.OrthographicCamera(
  -STONE_ORTHO_HALF_HEIGHT * STONE_ORTHO_INITIAL_ASPECT,
  STONE_ORTHO_HALF_HEIGHT * STONE_ORTHO_INITIAL_ASPECT,
  STONE_ORTHO_HALF_HEIGHT,
  -STONE_ORTHO_HALF_HEIGHT,
  0.01,
  100
);
camera.position.set(0, 0, STONE_ORTHO_BASE_DISTANCE);`;
if(!core.includes(cameraAnchor)) throw new Error('Perspective camera anchor was not found.');
core=core.replace(cameraAnchor,cameraReplacement);

const cameraPositionAnchor='      camera.position.set(0, 0, state.distance);';
const cameraPositionReplacement=`      camera.position.set(0, 0, STONE_ORTHO_BASE_DISTANCE);
  camera.zoom = STONE_ORTHO_BASE_DISTANCE / state.distance;
  camera.updateProjectionMatrix();`;
if(!core.includes(cameraPositionAnchor)) throw new Error('Camera distance anchor was not found.');
core=core.replace(cameraPositionAnchor,cameraPositionReplacement);

const resizeAnchor=`    function resizeRendererToViewport() {
      const { width, height } = getViewportSize();
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }`;
const resizeReplacement=`    function resizeRendererToViewport() {
      const { width, height } = getViewportSize();
      const aspect = width / height;
      camera.left = -STONE_ORTHO_HALF_HEIGHT * aspect;
      camera.right = STONE_ORTHO_HALF_HEIGHT * aspect;
      camera.top = STONE_ORTHO_HALF_HEIGHT;
      camera.bottom = -STONE_ORTHO_HALF_HEIGHT;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }`;
if(!core.includes(resizeAnchor)) throw new Error('Camera resize anchor was not found.');
core=core.replace(resizeAnchor,resizeReplacement);

        const equatorAnchor=`octaGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(equatorPoints),
      new THREE.LineBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.28, depthTest: true })
    ));`;
        const equatorNamed=`const stoneEquatorLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(equatorPoints),
      new THREE.LineBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.28, depthTest: true })
    );
    octaGroup.add(stoneEquatorLine);

    const stoneDoctrineRegionMaterial = new THREE.PointsMaterial({
      color:0xdc2626,
      size:0.05,
      transparent:true,
      opacity:0.72,
      depthTest:true,
      depthWrite:false,
      sizeAttenuation:true
    });
    const stoneDoctrineRegion = new THREE.Points(new THREE.BufferGeometry(),stoneDoctrineRegionMaterial);
    stoneDoctrineRegion.visible=false;
    stoneDoctrineRegion.renderOrder=9;
    octaGroup.add(stoneDoctrineRegion);

    const stoneDoctrineMeshMaterial = new THREE.MeshBasicMaterial({
      color:0xdc2626,
      transparent:true,
      opacity:0.42,
      side:THREE.DoubleSide,
      depthTest:true,
      depthWrite:false,
      polygonOffset:true,
      polygonOffsetFactor:-1,
      polygonOffsetUnits:-1
    });
    const stoneDoctrineMesh = new THREE.Mesh(new THREE.BufferGeometry(),stoneDoctrineMeshMaterial);
    stoneDoctrineMesh.visible=false;
    stoneDoctrineMesh.renderOrder=8;
    octaGroup.add(stoneDoctrineMesh);`;
        if(!core.includes(equatorAnchor)) throw new Error('Equator anchor was not found.');
        core=core.replace(equatorAnchor,equatorNamed);

        const viewAnchor='buildCanonicalViews();';
        const viewBridge=`buildCanonicalViews();
    let stonePrejudicePresentation=false;
    let stoneDoctrinePresentation=false;
    const stonePointerVisibility=()=>!stoneDoctrinePresentation && !stonePrejudicePresentation && !state.snappedTopBottom && state.uiMode!=='editor' && state.uiMode!=='questions';
    const clearDoctrineVisuals=()=>{
      stoneDoctrineRegion.visible=false;
      stoneDoctrineMesh.visible=false;
      stoneDoctrinePresentation=false;
      pointerMarker.visible=stonePointerVisibility();
    };
    window.STONE_VIEW={
  portalDistance(){
    return state.orientation.angleTo(
      makeCanonicalQuat(Math.PI / 4, Math.asin(1 / Math.sqrt(3)))
    );
  },
  setPortalOrientation(){
    state.orientation.copy(
      makeCanonicalQuat(Math.PI / 4, Math.asin(1 / Math.sqrt(3)))
    );
    state.snapQuat=null;
    state.angularSpeed=0;
    resetUprightStabilizer();
    state.panVel.set(0,0,0);
    state.zoomVel=0;
    state.target.set(0,0,0);
    state.distance=4.25;
    invalidateRender();
  },
      request(view,distance){
        let quat=null;
        if(view==='default'){
          quat=new THREE.Quaternion();
          state.target.set(0,0,0);
          state.panVel.set(0,0,0);
        }else if(view==='top'){
          quat=makeCanonicalQuat(0,Math.PI/2);
        }else if(view==='bottom'){
          quat=makeCanonicalQuat(0,-Math.PI/2);
        }else if(view==='side'){
          quat=makeCanonicalQuat(0,0);
        }else if(view==='collapse'){
          quat=makeCanonicalQuat(0,-0.22);
        }else{
          return;
        }
        startSoftSnap(quat);
        if(Number.isFinite(distance)){
          const targetDistance=Math.max(1.7,Math.min(12,distance));
          state.zoomVel=(targetDistance-state.distance)*(1-ZOOM_DAMP);
        }
      },
      setPrejudice(active){
        const on=!!active;
        stonePrejudicePresentation=on;
        pointerMarker.visible=stonePointerVisibility();
        stoneEquatorLine.material.color.setHex(on?0xdc2626:0x94a3b8);
        stoneEquatorLine.material.opacity=on?0.9:0.28;
        stoneEquatorLine.material.needsUpdate=true;
        invalidateRender();
      },
      setDoctrineRegion(points){
        const clean=Array.isArray(points)?points.filter(p=>Array.isArray(p)&&p.length===3&&p.every(Number.isFinite)):[];
        stoneDoctrineMesh.visible=false;
        const positions=[];
        for(const raw of clean){
          const p=new THREE.Vector3(raw[0],raw[1],raw[2]);
          const n=getOctaSurfaceNormal(p);
          p.addScaledVector(n,0.012);
          positions.push(p.x,p.y,p.z);
        }
        const geometry=new THREE.BufferGeometry();
        if(positions.length) geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
        stoneDoctrineRegion.geometry.dispose();
        stoneDoctrineRegion.geometry=geometry;
        stoneDoctrineRegion.visible=positions.length>0;
        stoneDoctrinePresentation=stoneDoctrineRegion.visible;
        pointerMarker.visible=stonePointerVisibility();
        invalidateRender();
      },
      setDoctrineRegionMesh(triangles){
        try{
          const clean=Array.isArray(triangles)?triangles.filter(t=>Array.isArray(t)&&t.length===3&&t.every(p=>Array.isArray(p)&&p.length===3&&p.every(Number.isFinite))):[];
          if(!clean.length){
            clearDoctrineVisuals();
            invalidateRender();
            return true;
          }
          const positions=[];
          for(const tri of clean){
            for(const raw of tri){
              const p=new THREE.Vector3(raw[0],raw[1],raw[2]);
              const n=getOctaSurfaceNormal(p);
              p.addScaledVector(n,0.010);
              positions.push(p.x,p.y,p.z);
            }
          }
          if(positions.length<9) return false;
          const geometry=new THREE.BufferGeometry();
          geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
          stoneDoctrineMesh.geometry.dispose();
          stoneDoctrineMesh.geometry=geometry;
          stoneDoctrineRegion.visible=false;
          stoneDoctrineMesh.visible=true;
          stoneDoctrinePresentation=true;
          pointerMarker.visible=stonePointerVisibility();
          invalidateRender();
          return true;
        }catch(err){
          console.warn('Doctrine mesh fallback:',err);
          return false;
        }
      },
      getState(){
        return {
          distance:state.distance,
          snappedTopBottom:state.snappedTopBottom,
          snapActive:!!state.snapQuat,
          pointerVisible:pointerMarker.visible,
          equatorColor:'#'+stoneEquatorLine.material.color.getHexString(),
          equatorOpacity:stoneEquatorLine.material.opacity,
          doctrineRegionVisible:stoneDoctrineMesh.visible||stoneDoctrineRegion.visible,
          doctrineRegionMode:stoneDoctrineMesh.visible?'mesh':stoneDoctrineRegion.visible?'points':'none',
          doctrineRegionPointCount:stoneDoctrineRegion.geometry.getAttribute('position')?.count||0,
          doctrineRegionTriangleCount:(stoneDoctrineMesh.geometry.getAttribute('position')?.count||0)/3,
          orientation:[state.orientation.x,state.orientation.y,state.orientation.z,state.orientation.w]
        };
      }
    };`;
        if(!core.includes(viewAnchor)) throw new Error('Native view anchor was not found.');
        core=core.replace(viewAnchor,viewBridge);

        const pointerVisibilityAnchor="pointerMarker.visible = !state.snappedTopBottom && state.uiMode !== 'editor' && state.uiMode !== 'questions';";
        const pointerVisibilityPatched="pointerMarker.visible = !stoneDoctrinePresentation && !stonePrejudicePresentation && !state.snappedTopBottom && state.uiMode !== 'editor' && state.uiMode !== 'questions';";
        if(!core.includes(pointerVisibilityAnchor)) throw new Error('Pointer visibility anchor was not found.');
        core=core.replace(pointerVisibilityAnchor,pointerVisibilityPatched);

        core=core.replace('</body>','<script src="worldview-layer.js?v=stone-v11-20261028"><\/script><script src="stone-data-v2.js?v=stone-v11-20261028"><\/script><script src="stone-readings-core-v2.js?v=stone-v11-20261028"><\/script><script src="stone-readings-more-v2.js?v=stone-v11-20261028"><\/script><script src="stone-referents-v4.js?v=stone-v11-20261028"><\/script><script src="stone-semantics-v5.js?v=stone-v11-20261028"><\/script><script src="stone-doctrines-v6.js?v=stone-v11-20261028"><\/script><script src="stone-ui-v2.js?v=stone-v11-20261028"><\/script><script src="stone-polish-v3.js?v=stone-v11-20261028"><\/script></body>');
        frame.addEventListener('load',()=>{
  const inner=frame.contentWindow;
  if(!inner) return;
  if(portalPreviewMode||portalArrival){
    inner.STONE_VIEW?.setPortalOrientation?.();
  }
  inner.addEventListener('pointerdown',event=>{
    activePortalPointers.add(event.pointerId);
  },true);
  inner.addEventListener('pointerup',event=>{
    activePortalPointers.delete(event.pointerId);
    setTimeout(()=>{
      if(activePortalPointers.size===0) commitReturnPortal();
    },0);
  },true);
  inner.addEventListener('pointercancel',event=>{
    activePortalPointers.delete(event.pointerId);
  },true);
  if(portalArrival) history.replaceState(null,'',location.pathname);
},{once:true});
frame.srcdoc=core;
        frame.hidden=false;
        boot.remove();
        if(!portalPreviewMode) requestAnimationFrame(updatePortalPreview);
      }catch(err){
        boot.textContent='The Philosopher\'s Stone could not start: '+err.message;
      }
    })();
  </script>
