    (async()=>{
      const frame=document.getElementById('appFrame');
      const boot=document.getElementById('boot');
const params=new URLSearchParams(location.search);
const portalPreviewMode=params.get('portal-preview')==='1';
const portalArrival=params.get('portal')==='from42';
const embeddedMode=params.get('embedded')==='1';
const RETURN_URL='https://raulmiguelparasiii.github.io/42/';
const PORTAL_PRELOAD_RADIUS=8*Math.PI/180;
const PORTAL_PREVIEW_RADIUS=4*Math.PI/180;
const PORTAL_MAX_OPACITY=.52;
const activePortalPointers=new Set();
let portalReturnFrame=null;
let portalTransitioning=false;
let portalArrivalLocked=portalArrival;
if(portalPreviewMode||portalArrival||embeddedMode) boot.textContent='';

const clamp01=value=>Math.max(0,Math.min(1,value));
const smoothstep=value=>value*value*(3-2*value);
const ensureReturnPreview=()=>{
  if(portalPreviewMode||portalReturnFrame) return portalReturnFrame;
  const preview=document.createElement('iframe');
  preview.id='portalPreview';
  preview.title='';
  preview.tabIndex=-1;
  preview.setAttribute('aria-hidden','true');
  preview.src=RETURN_URL+'?portal-preview=1';
  document.body.appendChild(preview);
  portalReturnFrame=preview;
  return preview;
};
const portalDistance=()=>{
  try{
    return frame.contentWindow?.STONE_VIEW?.portalDistance?.()??Infinity;
  }catch{
    return Infinity;
  }
};
const updatePortalPreview=()=>{
  if(portalPreviewMode||embeddedMode||portalTransitioning) return;
  const distance=portalDistance();
  if(portalArrivalLocked){
    if(distance>PORTAL_PREVIEW_RADIUS*1.5) portalArrivalLocked=false;
    if(portalReturnFrame) portalReturnFrame.style.opacity='0';
    requestAnimationFrame(updatePortalPreview);
    return;
  }
  if(distance<PORTAL_PRELOAD_RADIUS) ensureReturnPreview();
  const active=activePortalPointers.size>0;
  const amount=active?clamp01(1-distance/PORTAL_PREVIEW_RADIUS):0;
  const opacity=PORTAL_MAX_OPACITY*smoothstep(amount);
  if(portalReturnFrame) portalReturnFrame.style.opacity=String(opacity);
  requestAnimationFrame(updatePortalPreview);
};
const commitReturnPortal=()=>{
  if(portalPreviewMode||embeddedMode||portalArrivalLocked||portalTransitioning) return false;
  if(portalDistance()>PORTAL_PREVIEW_RADIUS) return false;
  portalTransitioning=true;
  const preview=ensureReturnPreview();
  if(preview){
    preview.classList.add('is-committing');
    preview.style.opacity='1';
  }
  setTimeout(()=>location.assign(RETURN_URL+'?portal=from-atlas'),230);
  return true;
};
      try{
        if(!('DecompressionStream' in window)) throw new Error('This browser does not support DecompressionStream.');
        const names=['core.01.b64','core.02.b64','core.03.b64','core.04.b64','core.05a.b64','core.05b.b64','core.06.b64','core.07.b64','core.08.b64'];
        const parts=await Promise.all(names.map(async name=>{
          const response=await fetch(name,{cache:'no-store'});
          if(!response.ok) throw new Error(`Could not load ${name}`);
          return (await response.text()).trim();
        }));
        const packed=parts.join('');
        const bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        let core=await new Response(stream).text();
        core=core.replaceAll('Epistemic Octahedron','The Philosopher’s Stone');
        core=core.replaceAll('EO Mobile Atlas Beta','The Philosopher’s Stone');

const cameraAnchor=`    const camera = new THREE.PerspectiveCamera(45, (viewport.clientWidth || window.innerWidth) / (viewport.clientHeight || window.innerHeight), 0.01, 100);`;
const cameraReplacement=`    const STONE_NATIVE_FOV = 45;
    const STONE_SEAM_FOV = 1.15;
    const camera = new THREE.PerspectiveCamera(
      STONE_NATIVE_FOV,
      (viewport.clientWidth || window.innerWidth) / (viewport.clientHeight || window.innerHeight),
      0.01,
      5000
    );
    let stoneProjectionBlend = 0;
    let stonePortalCameraDistance = null;`;
if(!core.includes(cameraAnchor)) throw new Error('Perspective camera anchor was not found.');
core=core.replace(cameraAnchor,cameraReplacement);

const cameraPositionAnchor='      camera.position.set(0, 0, state.distance);';
const cameraPositionReplacement=`      const stoneFov = THREE.MathUtils.lerp(STONE_NATIVE_FOV, STONE_SEAM_FOV, stoneProjectionBlend);
      camera.fov = stoneFov;
      camera.near = 0.01;
      camera.far = 5000;
      camera.updateProjectionMatrix();
      camera.position.set(0, 0, Number.isFinite(stonePortalCameraDistance) ? stonePortalCameraDistance : state.distance);`;
if(!core.includes(cameraPositionAnchor)) throw new Error('Camera distance anchor was not found.');
core=core.replace(cameraPositionAnchor,cameraPositionReplacement);

const cameraDynamicsAnchor=`      state.zoomVel *= ZOOM_DAMP;

      syncSceneMatrices();`;
const cameraDynamicsReplacement=`      state.zoomVel *= ZOOM_DAMP;

      applyStonePortalDynamics();

      syncSceneMatrices();`;
if(!core.includes(cameraDynamicsAnchor)) throw new Error('Camera dynamics anchor was not found.');
core=core.replace(cameraDynamicsAnchor,cameraDynamicsReplacement);

        const equatorAnchor=`octaGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(equatorPoints),

    ));`;
        const equatorNamed=`const stoneEquatorLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(equatorPoints),

    );
    octaGroup.add(stoneEquatorLine);

    const stoneDoctrineRegionMaterial = new THREE.PointsMaterial({

    });

    stoneDoctrineRegion.visible=false;
    stoneDoctrineRegion.renderOrder=9;
    octaGroup.add(stoneDoctrineRegion);

    const stoneDoctrineMeshMaterial = new THREE.MeshBasicMaterial({
      color:0xdc2626,

    octaGroup.add(stoneDoctrineMesh);`;
        if(!core.includes(equatorAnchor)) throw new Error('Equator anchor was not found.');
        core=core.replace(equatorAnchor,equatorNamed);

        const viewAnchor='buildCanonicalViews();';
        const viewBridge=`buildCanonicalViews();
    let stonePrejudicePresentation=false;
    let stoneDoctrinePresentation=false;
    let stoneEntranceHeld=false;

    const stonePortalHoldStyle=document.createElement('style');

      '#ui{transition:opacity 180ms ease!important}',

    const stonePortalQuatFrom42=(yaw,pitch)=>{
      const qx=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),pitch);
      const qy=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),yaw);
      return qx.multiply(qy).normalize();

    let stoneReturnRecovery=null;

      if(!rect) return null;

      viewport.style.setProperty('height',clean.height+'px','important');
      viewport.style.setProperty('margin','0','important');
      viewport.style.setProperty('transition','none','important');

      const {width,height}=getViewportSize();

      camera.updateMatrixWorld();

      if(!stonePortalLayout) return;

      if(!stonePortalLayout) return;

      state.panVel.set(0,0,0);

        started:performance.now(),

        endRect:{...stonePortalLayout.nativeRect},

      state.zoomVel=0;

    const stoneCancelReturnCapture=()=>{

        ? stoneReturnBlendStartQuat.clone()
        : null;
      stoneReturnArmed=false;
      stoneReturnDwellStarted=0;
      stoneReturnReady=false;
      stoneProjectionRecovery=startBlend>0.001
        ? {started:performance.now(),startBlend,duration:420}
        : null;
      stoneReturnRecovery=recoveryTarget?{
        started:0,
        duration:STONE_RETURN_RECOVERY_DURATION,
        startQuat:null,
        targetQuat:recoveryTarget,
        cancelQuat:state.orientation.clone(),
        abandoned:false
      }:null;
      stoneReturnBlendStartQuat=null;
      resetUprightStabilizer();
      invalidateRender();
      return true;
    };
    const stoneArmReturnFromThrow=()=>{
      if(!stoneCompositionBridgeEnabled||stoneEntranceHeld||stoneEntranceTransition) return false;
      if(stoneReturnArmed) return true;
      if(state.angularSpeed<STONE_RETURN_SPIN_MIN) return false;
      stoneReturnArmed=true;
      stoneReturnDwellStarted=0;
      stoneReturnBlendStartQuat=null;
      stoneReturnRecovery=null;
      stoneReturnReady=false;
      stoneProjectionRecovery=null;
      state.snapQuat=null;
      resetUprightStabilizer();
      invalidateRender();
      return true;
    };
    const stoneReturnDistance=()=>state.orientation.angleTo(stoneReturnTargetQuat());
    const stoneReturnAmount=()=>{
      if(!stoneReturnArmed) return 0;
      return stoneSmoothstep(stoneClamp01(1-stoneReturnDistance()/STONE_RETURN_PREVIEW_RADIUS));
    };
    const stoneApplyEntranceTransition=now=>{
      if(!stoneEntranceTransition||!stonePortalLayout) return;
      const tr=stoneEntranceTransition;
      const raw=stoneClamp01((now-tr.started)/tr.duration);
      const t=stoneSmoothstep(raw);
      const currentRect={
        left:tr.startRect.left+(tr.endRect.left-tr.startRect.left)*t,
        top:tr.startRect.top+(tr.endRect.top-tr.startRect.top)*t,
        width:tr.startRect.width+(tr.endRect.width-tr.startRect.width)*t,
        height:tr.startRect.height+(tr.endRect.height-tr.startRect.height)*t
      };
      setStonePortalViewportRect(currentRect);
      stoneProjectionBlend=1-t;
      const nativeScale=stoneNativeUnitScale(tr.endRect.height,state.distance);
      const desiredScale=tr.startUnitScale+(nativeScale-tr.startUnitScale)*t;
      stonePortalCameraDistance=stoneDistanceForScale(currentRect.height,desiredScale,stoneCurrentFov());
      const rotating=state.rotating||state.gestureRotating||state.continuingGestureRotate;
      if(rotating) stoneEntranceTransition.orientationUserOwned=true;
      if(!stoneEntranceTransition.orientationUserOwned){
        state.orientation.slerpQuaternions(tr.startQuat,tr.targetQuat,t);
        state.angularSpeed=0;
        state.snapQuat=null;
        resetUprightStabilizer();
      }
      if(raw>=1){
        if(!stoneEntranceTransition.orientationUserOwned){
          state.orientation.copy(tr.targetQuat);
        }
        stoneFinishPortalLayout();
      }
    };
    const stoneApplyProjectionRecovery=now=>{
      if(!stoneProjectionRecovery||stoneReturnArmed||stoneEntranceTransition) return;
      const raw=stoneClamp01((now-stoneProjectionRecovery.started)/(stoneProjectionRecovery.duration||180));
      const t=stoneSmoothstep(raw);
      stoneProjectionBlend=stoneProjectionRecovery.startBlend*(1-t);
      const {height}=getViewportSize();
      const nativeScale=stoneNativeUnitScale(height,state.distance);
      stonePortalCameraDistance=stoneProjectionBlend>0.001
        ? stoneDistanceForScale(height,nativeScale,stoneCurrentFov())
        : null;
      if(raw>=1){
        stoneProjectionBlend=0;
        stonePortalCameraDistance=null;
        stoneProjectionRecovery=null;
      }

      const untouched=state.activePointers.size===0&&!state.rotating&&!state.gestureRotating&&!state.continuingGestureRotate;
      if(stoneReturnDwellStarted&&stoneReturnBlendStartQuat){
        const raw=stoneClamp01((now-stoneReturnDwellStarted)/STONE_RETURN_DWELL_MS);
        const t=stoneSmoothstep(raw);
        state.orientation.slerpQuaternions(stoneReturnBlendStartQuat,target,t);
        state.angularSpeed=0;
        state.snapQuat=null;
        resetUprightStabilizer();
        if(raw>=1){
          state.orientation.copy(target);
          stoneReturnReady=true;
        }

        const speedPhase=stoneClamp01(1-state.angularSpeed/STONE_RETURN_SPIN_MIN);
        const gravity=0.0015+0.030*speedPhase*speedPhase;
        state.orientation.slerp(target,gravity);
        const distance=state.orientation.angleTo(target);
        if(untouched&&distance<=STONE_RETURN_PREVIEW_RADIUS&&state.angularSpeed<=STONE_RETURN_BLEND_SPEED){
          stoneReturnDwellStarted=now;
          stoneReturnBlendStartQuat=state.orientation.clone();
          stoneReturnReady=false;
          state.angularSpeed=0;
          state.snapQuat=null;
          resetUprightStabilizer();
        }
      }

      stoneProjectionBlend=amount;
      const {height}=getViewportSize();
      const nativeScale=stoneNativeUnitScale(height,state.distance);

        ? stoneDistanceForScale(height,nativeScale,stoneCurrentFov())
        : null;
    };
    const stoneApplyReturnRecovery=now=>{
      if(!stoneReturnRecovery||stoneReturnArmed||stoneEntranceTransition) return;

          state.orientation.angleTo(recovery.cancelQuat)>STONE_RETURN_CANCEL_ROTATION_EPS||
          state.angularSpeed>0.0015
        ) recovery.abandoned=true;
        return;

        stoneReturnRecovery=null;

      const raw=stoneClamp01((now-recovery.started)/recovery.duration);

      state.angularSpeed=0;

    const applyStonePortalDynamics=()=>{
